# @package _global_
# D121 arm 2 — **text 도 video 도 PE-AV** (사용자 지시 2026-09-04: "text, video encoder 다 PE-AV꺼").
# `vista4d_d121_da3.yaml` 과 **PE-AV 4줄 + exp_name 만** 다르다. 데이터·하이퍼는 전부 같다.
#
#   text CA (PE-AV text tower, ModernBERT 22층, 1024-d)
#     -> video CA (PE-AV visual tower, 프레임당 토큰 1개 × 49, 1792-d)
#       -> geo CA (DA3)
#
# umt5-xxl 은 아예 안 띄운다 (text_encoder=PEAV 면 T5EncoderModel 을 만들지 않는다).
#
# ═══ dynpose_d117b 와 무엇이 다른가 ═══════════════════════════════════════════════════════
# 코퍼스가 dynpose d107 -> vista d121 로 바뀐 것이 전부다. 그리고 그 때문에 **캡션 소스가
# 바뀐다**: d117b 는 `cache_peav_embeddings.py:nl_caption` 이 caption_fields 에서 규칙으로
# 조립한 문장이었지만, d121 은 `prompt_camera_with_scene_video.concise` **완성문을 그대로**
# 굽는다 (`--caption_source concise`). 그래야 arm 1(umt5)이 보는 문자열과 글자 단위로 같아서
# 두 arm 의 차이가 인코더 차이로만 남는다.
#
# 캡션이 길어져 text_len 이 d107 의 26 토큰에서 크게 올라간다 — 캐시를 `--text_len 0`(실측
# 최대)으로 구웠고, 학습 쪽은 캐시에 실린 L 을 그대로 읽으므로 여기 적을 값이 없다.
#
# peav_in_ln / video_gate / video_text_in_stream 은 config.yaml 기본값(true/true/false)이 그대로
# 맞아서 다시 적지 않는다. video_text_in_stream=false 인 이유: PE-AV text 는 이미 text CA 로 갔다.
exp_name: vista4d_d121_peav
dl3dv_root: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121
meta_csv: meta_vista4d.csv
train_seg_list: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121/seg_list_vista4d_train.txt
test_seg_list: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121/seg_list_vista4d_test.txt
coverage_blacklist_path: null

pose_source: da3
target_pose_source: da3_target_poses   # target 만 <scene>/da3/target_poses.npz 로 교체
scale_mode: avg_scale
avg_scale_ref: context_first_cam       # 디렉토리 avg_scale_context_first_cam <- scene_graph S
intr_norm: rel                         # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                            # = 그 ckpt 의 latent_dim

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last

geo_view_sampling: context_uniform  # context range = 영상 전체 [0,49) = 소스 영상 전체
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true       # view0 = 프레임 s(=0). 이미 첫 픽이라 집합이 안 바뀐다.

geo_raw_cache_dir: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3/geo_raw_cache_da3
da3_cam_token_per_sample: true   # 캐시는 B=1 로 구워진다 — 켜야 on-the-fly 폴백과 일치

anchor_pred_frame0: true

# ═══ PE-AV: text CA + video CA 둘 다 ══════════════════════════════════════════════════════
text_encoder: PEAV                  # umt5 미사용. text CA 입력 = peav_text (1024-d)
peav_video_cache_dir: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121/peav_cache/video
peav_text_cache: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121/peav_cache/text_nl.pt
video_latent_dim: 1792              # pe-av-large visual tower per-frame 토큰

batch_size: 8
epochs: 200
ckpt_at_epochs: [50, 100]
