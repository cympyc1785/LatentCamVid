defaults:
- _self_
- experiment: null
exp_name: dl3dv_latent_baseline
val_ckpt_path: null
load_ckpt_path: null
embed_path: null
random_seed: 42
lr: 0.0001
batch_size: 8
accum_steps: 1
# [2026-09-05] 사용자 지시 "이후 돌리는 학습들도 다 100epoch만 돌도록해줘". 기본값을
# 2000 -> 100 으로 낮춘다. 지금까지 arm 들은 experiment yaml 에서 `epochs: 200` 으로 덮고
# 100/200 두 지점 ckpt 를 남겼는데(`ckpt_at_epochs: [50, 100]`), 실제로 비교에 쓰인 건 항상
# epoch100 이었다. **새 experiment yaml 에서는 `epochs` 를 덮지 말 것** — 덮으면 이 기본값이
# 무력화된다. 옛 experiment yaml 의 `epochs: 200` 은 그 run 이 실제로 무엇으로 돌았는지의
# 기록이라 건드리지 않는다 (재실행할 때만 지우면 된다).
epochs: 100
# 위 `epochs` 를 experiment yaml 이 덮어도 **여기서 다시 자른다** (train_latent_cam_dm.py 의
# epoch 루프). experiment yaml 73개가 `epochs` 를 덮고 있어서(19개가 200) 기본값만으로는
# 재실행 때 조용히 200 을 간다. `null` 이면 상한 없음 = 예전 동작 그대로.
# [2026-09-19] 100 -> 50 (사용자 지시 "학습 50epoch까지만 돌려도 될 것 같아").
# 루프가 `range(start_epoch, 50)` 이라 **마지막 epoch 인덱스는 49**, 총 50 epoch 이다.
# 그래서 experiment yaml 의 `ckpt_at_epochs: [50, 100]` 은 이제 한 번도 안 걸린다 —
# 최종 모델은 `last.pth` / `resume.pth`(= epoch 49) 다.
epoch_cap: 50
# [new 2026-09-18] 진단용 단계별 스텝 시간. 0 = 끔(측정 코드가 아예 안 돈다 = 예전 동작 그대로).
# N>0 이면 N 스텝마다 data/h2d/text_vae/geo/fwd/bwd_opt/log 평균 ms 를 찍는다. 구간 경계마다
# cuda.synchronize() 가 걸려 파이프라인이 직렬화되므로 켠 run 은 평소보다 느리다 -> 상시 금지.
step_timing: 0
save_epoch: 10
val_step: 5000
val_max_batches: 20

# [new 2026-08-09] run_validation 의 sample() 이 뽑는 x_T 를 고정한다 (배치마다 seed+step).
# 왜: val/loss_traj 는 segment 당 표본 1개와 GT 의 MSE 라, 가중치가 그대로여도 노이즈 추첨만
# 바뀌면 값이 흔들린다. 7K 3 arm 실측 plateau sd = 0.0046 (평균 0.0646 의 7%) 인데 비교하려는
# withs vs nos 격차는 0.0005 (0.11 sd) 라 곡선으로는 아무것도 못 읽었다. 시드를 고정하면
# epoch 간/arm 간이 같은 노이즈를 쓰는 짝지은 비교가 되어 가중치 변화만 남는다.
# null 로 두면 기존과 동일하게 전역 RNG 를 쓴다. 비교할 run 끼리는 batch_size 가 같아야 한다.
# 주의: 이 값이 켜진 run 의 val 곡선은 꺼진 run(예 20260808_140209_da3_7k_*)과 절대 수치가
# 서로 다른 노이즈 위에서 잰 것이라 곧바로 겹쳐 읽으면 안 된다.
val_sample_seed: 42

sample_data: null
load_points: false
load_saved_pc_embeds: false
use_concerto: false
attn_loss_weight: 0.01
max_trans_norm: false
model_type: baseline
sampling_type: ddim
diffusion_max_step: 1000
diffusion_inference_step: 50
beta_start: 0.00085
beta_end: 0.012
prediction_type: epsilon
beta_schedule: scaled_linear
clip_sample: false
set_alpha_to_one: false
steps_offset: 1
is_ar: false
ar_chunk_size: 3
causal_vae: false
per_token_noise: false
cfg_dropout_p: 0.1
loss_tau_min: 0.02
scale_mode: avg_scale
# [new 2026-08-17] scale_mode: 'const' 전용 — 세그먼트별 적응 분모 대신 쓸 **코퍼스 상수**.
# "scale align 만 뺀" ablation arm 용이다 (다른 scale_mode 에서는 읽지 않는다).
# 코퍼스 **기하평균**으로 잡을 것: mean||t||/분모 의 로그 평균 레벨이 보존돼 vae_latent_scale 과
# diffusion 입력 std 가 대조군과 같은 자리에 남는다. 실측(da3_7k train 29414 세그먼트,
# avg_scale_ref=front_first_anchor): geomean 3.982685 / med 3.614095 / log10std 0.3287.
norm_scale_const: null
# [new] intrinsics encoding of cam_param[..., 9:11] — a property of the VAE CKPT, independent of
# scale_mode. 'raw' = fx/2cx, fy/2cy (0.448, 0.796) | 'rel' = /frame0 (exactly 1.0 for DL3DV)
# | 'auto' = legacy coupling ('rel' iff scale_mode == avg_scale). Mismatch vs the ckpt silently
# destroys the intr channels (recon L1 0.26-0.36 instead of 0.002-0.013) — see dataset_dl3dv
# docstring and scripts/vae/vae_scale_matrix.py. vae_20260302_300 -> 'rel',
# vae_20260202_065659_400 -> 'raw'.
intr_norm: rel
# [new 2026-08-06] cam_param[..., 6:9] 의 표현. intr_norm 과 마찬가지로 **VAE CKPT 의 속성**이라
# 학습 때와 다르게 주면 recon 이 조용히 망가진다.
#   'w2c' (기본, 기존 ckpt 전부) w2c translation t = -Rc
#   'c2w'                       카메라 중심 c
# ||t|| == ||c|| 이므로 norm_scale 분모와 크기 분포는 동일하고 방향만 다르다. w2c 는
# Δt = -R_i·Δc - ΔR·c_{i+1} 로 회전이 translation 에 섞인다 (Step 0 진단:
# scripts/data/cam_repr_w2c_vs_c2w.py, DL3DV 35,845 seg 에서 bleed p50 0.500 / curv 비 p50 1.078).
# 어느 쪽이 실제로 회귀하기 쉬운지는 VAE 를 양쪽으로 fit 해서 잰다
# (vae_transrepr_{w2c,c2w}.yaml + scripts/vae/vae_trans_repr_recon.py).
# !! 디코드 경로(utils/data_utils.out_to_trajectory)에 trans_repr 인자는 있지만 DM/추론 스크립트는
#    아직 그걸 넘기지 않는다. 'c2w' ckpt 를 DM 에 쓰려면 그 호출부부터 배선해야 한다.
trans_repr: w2c
# [new 2026-08-23] target 첫 카메라를 **given** 으로 취급할지 (decode 경로에서만 작동).
#   false (기본, 기존 동작) out_to_trajectory 가 e0 를 곱하기만 한다. rel[0]=I 는 모델이
#         예측해야 하는 값이고, 틀리면 궤적 전체가 그만큼 통째로 밀린다.
#   true  rel'_t = rel_t @ inv(rel_0) 로 재앵커해서 rel'[0]=I 를 강제한다. 프레임 간 상대
#         운동은 보존되고, dataset 이 cam_param 을 만드는 식(w2c_t @ inv(w2c_0)) 과 같은 꼴이다.
# 실측 근거 (TRUMANS-Lite vls019 epoch 82, val 14 타깃 median): frame0 |Δt| 0.1105
# (= GT path_len 의 0.20배, 최대 0.80배), frame0 rot 1.79°. 같은 잣대로 frozen VAE 왕복은
# 0.0019 / 0.129° 라 이 오차는 diffusion 이 낸 것이다 (scripts/vae/vae_roundtrip_val.py).
# GT(cam_param) 는 이미 rel[0]=I 라 true 여도 no-op — pred 에만 효과가 있다.
# !! loss(loss_latent / loss_traj) 는 안 건드린다. 학습 신호는 그대로 두고 decode 만 앵커한다.
anchor_pred_frame0: false
# [new 2026-08-06] scene 의 pose / intrinsics / caption / avg_scale 을 어느 코퍼스에서 읽을지.
#   'transforms' (기본, 기존 동작) <scene>/{transforms.json, prompts.json, avg_scale/}
#   'da3'                          <scene>/da3/{pose.npz, prompts.json, avg_scale/}
# da3/pose.npz 의 extrinsics 는 **OpenCV w2c** 다 (transforms.json 처럼 GL->CV flip 하거나
# 역행렬 취하면 안 된다). GT 와 Umeyama 정렬 시 12개 표본 scene 중 11개가 ATE/extent <= 0.004,
# 회전 평균 <= 0.32deg 로 사실상 GT 급이다.
# !! <scene>/pose_eval_vs_gt.json 과 da3_camcond_report.json 의 "convention":"c2w" / da3
#    ATE_norm 0.4764 / Rot_mean 172deg 는 이 규약을 c2w 로 잘못 읽어서 나온 값이라 무시할 것.
# da3 intrinsics 는 프레임마다 미세하게 다르므로(scene 내 std/mean 7e-4~3e-3) intr_norm='rel'
# 에서 cam_param[9:11] 이 정확히 [1,1] 이 아니라 1.000 +- 0.003 이 된다.
# 인덱스 캐시 키에는 'transforms' 가 아닐 때만 __ps<source> 가 붙는다(기존 캐시 재사용 보존).
pose_source: transforms
# [new 2026-08-10] scale_mode='avg_scale' + pose_source='da3' 에서 저장된 avg_scale 을 **어느
# 기준점에서 잰 파일**로 읽을지. 점 집합(context range unproject)은 같고 기준점만 다르다.
#   'centroid'          (기본, 기존 동작) <scene>/da3/avg_scale/          context 카메라 centroid 기준
#   'context_first_cam'                   <scene>/da3/avg_scale_context_first_cam/  context 첫 카메라 기준
# [new 2026-08-13] 아래 둘은 context range 를 **target 앞쪽으로 고정**하고 기준점을 **target
# segment 첫 카메라 s** 로 잡는다 (cam_param 재고정 기준 E @ inv(E_s) 와 분모 기준을 일치시킴).
#   'front_first_anchor'          <scene>/da3/avg_scale_front_first_anchor/           range [0, s)
#   'front_first_anchor_same_len' <scene>/da3/avg_scale_front_first_anchor_same_len/  range [s-L, s), L=e-s
# 앞쪽을 못 채우는 세그먼트는 파일이 없고 dataset 이 인덱스에서 제외한다 (da3_7k 는 전 세그먼트
# 길이 49 / s in {0,49,...} 이라 두 변형 모두 s==0 만 빠져 서로 paired 비교가 된다).
# pose_source != 'da3' 과 같이 쓰면 에러 (해당 디렉토리가 da3 아래에만 있다).
# 실측 (da3_7k 39817 세그먼트): first_cam/centroid 비 med 1.41159 -> 분모가 커져 정규화된
# translation 이 작아진다. vae_latent_scale 을 그대로 두면 diffusion 입력 std 가 arm 마다 달라진다.
# [new 2026-08-30] Vista4D 뱅크 전용 -- 위와 달리 **점 집합 규약 자체가 다르다** (conf>=P40 이
# 아니라 non-sky 전 픽셀, z 를 ray 길이로 곱함).
#   'ctx_all_first_cam'  <scene>/da3/avg_scale_ctx_all_first_cam/
# Vista4D 뱅크에서 'context_first_cam' 에 들어 있는 값은 scene_graph.json:scale.S 즉 **frame0
# 한 장**의 평균 ray 길이라, context range 가 영상 전체 [0,49) 인데 분모만 첫 프레임에서 나왔다.
# 'ctx_all_first_cam' 은 **전 프레임 depth 를 unproject 한 점군 전체**에서 첫 카메라까지의
# 평균 거리다 (기준점은 그대로, 점 집합만 구간 전체). 52편 ratio med 1.0110 / max 6.1598
# (camera-lens: z_med 1.06 -> 20.84 인 pull-out) -- 대부분 그대로고 깊이가 크게 변하는 씬만 바뀐다.
avg_scale_ref: centroid
# [new 2026-08-27] target 궤적만 **합성 pseudo-GT** 로 갈아끼운다. context (이미지·pose·avg_scale
# 분모) 는 소스 recon 그대로라, 모델이 배우는 건 "이 씬을 (텍스트가 말하는 대로) 이렇게 찍었다면"
# 이 된다. GT 카메라가 없는 코퍼스(Vista4D / TRUMANS)를 학습에 넣는 유일한 경로다.
#   null                (기본, 기존 동작) target 도 context 와 같은 pose 배열에서 슬라이스
#   'da3_target_poses'  <scene>/da3/target_poses.npz 의 (V,T,4,4) w2c + (V,T,3,3) K 를 target 으로
#                       쓴다. 어느 변이(V) 인지는 세그먼트 이름 끝의 키로 고른다.
# pose_source='da3' 에서만 쓸 수 있다 (파일이 da3 아래에만 있다).
target_pose_source: null
lazy_dataset: true        # [new] __init__ builds only the sample index (cached); scene poses parsed lazily in __getitem__
use_vae: true
num_cam: 13
cam_dim: 64                 # MUST match the ckpt's latent_dim (20260302 -> 64, 20260202 -> 32)
vae_beta: 0.001
# SCVideo's config_large.py setting: vae_latent_scale 0.96032625 + 20260302/300.pth,
# scale_mode avg_scale, intr_norm rel, cam_dim 64 -- all matched above, constant used verbatim.
# That is genuinely config_large's pipeline: data/dataset_large.py:295-304 divides translations by
# the STORED point-cloud avg_scale (= our scale_mode 'avg_scale'; 'saved_avg_scale' is an alias)
# and line 313 divides the intrinsics by frame 0 (= our intr_norm 'rel').
# !! NOTE vae_latent_scale is supposed to be the MEASURED latent std of the
# (ckpt, scale_mode, intr_norm) triple, because train/infer do `encode(traj) / vae_latent_scale`.
# 0.96032625 was fit over SCVideo's MIXED corpus (DL3DV + DynamicVerse + dynpose-100k); on
# DL3DV-only this triple measures 0.47637, so the diffusion input std is **0.4960**, not 1.0000
# (i.e. the latents reach the model ~2.02x too SMALL). Kept verbatim by explicit user decision;
# use 0.47637 for exactly unit-std input on DL3DV-only.
# !! [2026-08-01] The per-cell numbers below are the script's MAX_SCENES=200 default (1264
# samples). That subset is LOW-MOTION and reads 4-7% low on every scale_mode -- systematic, not
# sampling noise. The FULL corpus (39817 segments / 6095 scenes) for vae_20260302_300 @ intr rel:
#   avg_scale 0.47637 (was 0.44696) | ctx_longer_135max 0.58341 (0.55882) | geo_lagernvs 0.53716
#   (0.51180); recon L1 trans 0.00336 / 0.00495 / 0.00430.
# Any config that pins vae_latent_scale must use a FULL-corpus measurement.
# [2026-08-02] DynamicVerse 도 같이 재봤다 (DATASET=dynamicverse|both, 606 scene / 1818 chunk,
# avg_scale 커버리지 1818/1818). vae_20260302_300 @ rel, FULL corpus:
#   scale_mode          DL3DV     DV       DL3DV+DV(41635)
#   avg_scale           0.47637   0.10070  0.46632
#   ctx_longer_135max   0.58341   0.42224  0.57732
#   geo_lagernvs        0.53716   0.32543  0.52968
# DV 의 avg_scale 행이 0.10 으로 극단적으로 작다: point-cloud avg_scale(장면 depth)이 카메라 이동보다
# 훨씬 커서 translation 이 거의 0 으로 눌린다 (recon L1 trans 0.00131 로 전 cell 중 최소지만
# 그건 표적이 작아서지 잘 맞춰서가 아니다). context 기반 분모(ctx_longer_135max/geo_lagernvs)에서도
# DV 가 DL3DV 보다 작다(0.42/0.33). 즉 DV 를 섞어도 0.96032625 는 재현되지 않는다 --
# 그 상수는 dynpose-100k 를 포함한 SCVideo 원본 corpus 값이고 우리 데이터로는 설명 안 된다.
# 지금 3-arm 은 DL3DV-only 학습이므로 config 에 박는 값은 DL3DV 열을 쓴다.
# Measured on 1264 DL3DV samples by scripts/vae/vae_scale_matrix.py (lat.std | recon L1
# rot/trans/intr):
#   20260302_300 (64) avg_scale rel -> 0.44696 | 0.00504 0.00301 0.00222   <-- active triple
#                                     (best recon of any cell measured)
#   20260302_300 (64) cam_dist_mean rel -> 0.99270                          (≈0.96 by coincidence;
#                                     NOT config_large's normalization -- do not use to justify it)
#   20260202_400 (32) avg_scale raw -> 0.46312 | 0.00466 0.00495 0.00293   (the DL3DV-only
#                                     config.py pair; needs cam_dim 32 + intr_norm raw)
#   20260202_400 (32) avg_scale rel -> 0.63741 | 0.00648 0.01081 0.26291   (wrong intr convention)
#   vae_dl3dv_1_7k (32) avg_scale raw -> 0.60943 | 0.00562 0.00953 0.00433 (our 1K-7K re-fit,
#                                     my_checkpoints/vae_dl3dv_1_7k/last.pth, scale 0.635126)
# See the dataset_dl3dv docstring: the intr convention is fixed by the CKPT, the scale_mode only
# rescales the translations. The full 16-cell matrix is in the CHANGELOG.
vae_latent_scale: 0.96032625
vae_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/checkpoints/vae_20260302_300.pth
num_gpus: 1
num_thread: 8
num_frames: 49
# 'T5' (기본) = umt5-xxl 을 여기서 돌려 text CA 에 먹인다 (4096-d).
# [new 2026-09-03] 'PEAV' = umt5 를 아예 안 띄우고 peav_text_cache 의 PE-AV text tower 토큰
#   (1024-d) 을 그대로 text CA 로 (arm B). 그러면 캡션도 struct 가 아니라 자연어여야 한다 —
#   PE-AV 임베딩 공간에서 struct 형식이 4형식 중 꼴찌였다 (peav_target_match.py, 2026-09-03).
text_encoder: T5
text_len: 512
t5_dtype: bfloat16
t5_checkpoint_dir: /data1/cympyc1785/LatentCamVid/video_generation/models/DiffSynth-Studio/Wan-AI/Wan2.2-TI2V-5B
t5_checkpoint_path: models_t5_umt5-xxl-enc-bf16.pth
t5_tokenizer_path: google/umt5-xxl
# [new 2026-09-19] umt5 prefill 캐시 (`main/cache_umt5_embeddings.py` 가 굽는다).
# null = 예전 그대로 매 스텝 umt5 forward. 경로를 주면 `models/t5.py:CachedT5TextEmbeddings` 가
# 캡션 문자열로 조회하고, 캐시에 없는 문자열만 원래 인코더로 넘긴다(결과 동일 + miss 로그).
text_emb_cache_path: null
text_emb_cache_mmap: true
point_encoder: concerto
# ===== DL3DV data + geo (scene-image) conditioning (latentcam additions beyond the
# original SCVideo text->camera config; [new] = added after config.py) =====
# [new 2026-08-10] 어느 코퍼스로 학습할지. 'dl3dv' (기본) = 기존 동작 그대로.
#   'scene_decoupled'  main/dataset_scene_decoupled.py — 같은 scene 의 **다른 clip** 이 context.
#     sample = (target clip, context clip) 쌍이고 train/test_seg_list 로 **고정**된다
#     (scripts/data/sd_build_seg_lists.py: static clip 제외 + align resid p99 컷 + scene 단위 90/10).
#     스케일 규약: clip 별 umeyama sim3 로 pose/depth 를 GT meters 로 올린 뒤 **context clip 의**
#     avg_scale_align 하나로 전부 나눈다 (추론 때 아는 건 context 뿐이라 target 분모는 누수).
#     dl3dv_root / meta_csv / coverage_blacklist_path 는 이 모드에서 쓰이지 않는다.
#   [new 2026-08-16]
#   'datadop'  main/dataset_datadop.py — shot 당 궤적 1개, **frame 0 한 장만 context** (V=1).
#     세그먼트 프레임 시퀀스가 없어 out-of-seg context 라는 개념 자체가 없다. datadop_* 참고.
#   'mixed'    main/dataset_mixed.py — 위 셋을 한 학습에 섞는다. `datasets:` 블록으로 코퍼스별
#     override 를 준다. **배치 하나 = 코퍼스 하나** (V/geo_hw 가 코퍼스마다 달라 torch.stack 이
#     안 되므로; main/mixed_sampler.py PerCorpusBatchSampler).
dataset_name: dl3dv
sd_root: /data1/cympyc1785/data/Scene-Decoupled-Video-dataset
sd_split: whuman              # 'whuman' | 'wohuman'
sd_geo_views: null            # context view 수. null = context clip segment 의 49 프레임 전부
                              #   (dynamic scene 이라 시간축이 다 필요하다는 결정, 2026-08-10).
                              #   int 면 균등 subsample — OOM 시 줄이는 손잡이.
# [new 2026-08-16] Scene-Decoupled 의 (target, context) 페어링 방식.
#   'list'         (기본, 기존 동작과 bit-identical) seg list 의 `scene__tgt__ctx` 행을 그대로 쓴다.
#                  sd_build_seg_lists.py 가 scene 당 **모든 순서쌍**을 나열하므로 train 52286 행.
#   'random_scene' 고유 target clip 당 1행으로 dedupe(52286 -> 14017) 하고, context 는 __getitem__
#                  에서 **같은 scene 의 다른 clip 중 균등 추출**. (a) 혼합 시 코퍼스 균형(3.7배 축소),
#                  (b) epoch 마다 context 가 바뀌는 augmentation. 인덱스 캐시 키에 들어간다.
sd_pair_mode: list
dl3dv_root: /data1/cympyc1785/data/DL3DV/scenes   # DL3DV scene root (images_8 = 480x270; see dataset_dl3dv.py)
meta_csv: meta.csv            # [new] scene-list CSV under dl3dv_root (e.g. meta_worldtraj.csv = 1K-7K − blacklist)
# [new 2026-08-27] 세그먼트 키/frame_idx 는 그대로 두고 **캡션만** 다른 파일에서 읽는다.
#   'prompts.json'        (기본, 기존 동작) <scene>/[da3/]prompts.json
#   'prompts_simple.json' 같은 세그먼트에 축약 캡션 ("target: woman. motion: arc left and push in")
# 경로 규칙은 prompts.json 과 같다 -- pose_source='da3' 면 <scene>/da3/<이 파일>.
# 캡션은 인덱스 캐시 안에 저장되므로 기본값이 아닐 때 캐시 키에 __pf<stem> 이 붙는다
# (기본값이면 안 붙어서 기존 캐시가 그대로 재사용된다).
prompts_file: prompts.json
# [new 2026-08-27] subject OBB track concat 조건. >0 이면 <scene>/da3/target_track.npz 의
# world 궤적을 frame-s 카메라 좌표 + norm_scale 게이지로 옮긴 (T,4)[xyz,valid] 를 latent 토큰
# 길이로 interp 해 x_t 채널에 concat 한다 (4 = xyz+valid). 0 = 기존 구조/동작 비트 동일.
target_track_dim: 0
target_track_dropout: 0.1     # per-sample null 드랍 (추론에서 track 없이 쓸 수 있게)
# [new 2026-08-28] val 을 **track 없이**(cond = 전 채널 0 = null) 돌린다. false = 기존 동작
# (val 은 실제 track 을 그대로 받는다). true 면 val 곡선이 "track 없이도 얼마나 하나"를 재므로
# target_track_dim=0 arm 과 같은 눈금이 되고, dropout 이 실제로 null 조건을 학습시켰는지가
# 학습 중에 바로 보인다. target_track_dim=0 이면 조건 자체가 없어 no-op.
target_track_val_drop: false
max_scenes: null              # cap #scenes loaded (null = all; small int for smoke tests)
train_seg_list: null          # [new] explicit train segment-list file (<batch>/<hash>/<seg>); null = random 90/10 split
test_seg_list: null           # [new] explicit val/test segment-list file; val = its first (val_max_batches×batch_size) segments

# ===== [new 2026-08-16] DataDoP (dataset_name: 'datadop') =====
# shot 당 궤적 1개 + `<shot>_rgb.png` 한 장 + `<shot>_depth.npy` 한 장이 전부라 context 는
# **frame 0 하나(V=1)** 다. 포즈는 `<shot>_transforms_cleaning.json` 의 OpenGL c2w 120 프레임
# (DL3DV 와 같은 `c2w @ _GL2CV` -> inv 변환). mp4 는 **열지 않는다** (별도 재다운로드라 frame0 이
# _rgb.png 와 다르다 — 실측 best match mp4 frame 1~6).
datadop_root: /data1/cympyc1785/data/DataDoP/DataDoP_with_scene
datadop_caption_key: 'Concise Interaction'   # med 182자. 'Movement'(101자)는 scene 단어가 없어
                              #   혼합 시 "scene 단어 없음 ⇒ DataDoP" 지름길을 학습한다. 쓰지 말 것.
# translation 분모(divisor). 모델이 보는 값은 m = mean_t||c_t − c_0|| / D.
#   'none' (기본) D = 1. **MonST3R 가 이미 게이지를 걸어 놨기 때문**에 이게 맞다:
#     loss 가 pred/GT 를 둘 다 norm_mode='avg_dis' 로 나누고(미터를 배울 기회 없음),
#     global aligner 가 norm_pw_scale=True(하드코딩) + base_scale=0.5 로 pairwise 스케일의
#     **기하평균을 0.5 에 못 박는다**. 즉 world 단위가 shot 마다 임의가 아니라 이미 공통이다.
#     소스 추적 + 수치: results/datadop/monst3r_scale_normalization.md
#     레벨이 DL3DV 와 맞아서가 **아니다** — 안 맞는다 (아래 datadop_norm_gain 주석 참고).
#     'none' 을 고르는 이유는 게이지 논거 + 더 작은 산포(sd(log10 m) 0.488 < 0.508) 뿐이다.
#   'meanray'     D = frame0 의 mean(depth · ||K⁻¹[u+.5,v+.5,1]||). 정의는 DL3DV 의 저장된
#     avg_scale(mean||P − C_ctx0||)과 같지만, 이미 걸린 게이지를 **한 번 더 거는** 셈이라
#     산포가 오히려 커진다 (sd(log10 m) 0.685 -> 0.717) 그리고 p95 가 DL3DV 의 3.5배가 된다.
datadop_divisor: none
datadop_norm_gain: 1.0        # [사용 안 함] 혼합 경로는 `norm_scale_gain` (dataset_dl3dv.py
                              #   `_target_out` 에서 분모에 나누는 값) 으로 통일했다. 이 키는
                              #   datadop 단독 경로의 유물이라 1.0 으로 두고 건드리지 말 것.
# 2026-08-16 데이터셋 실측 (scripts/data/corpus_scale_probe.py, cam_param[:,6:9] 직접, n=300):
#   DL3DV(frontanchor) med 0.4367 p95 0.8934 sd 0.285 | SD med 0.0878 p95 0.2480 sd 0.365
#   DataDoP(D=1)       med 0.0911 p95 0.4095 sd 0.489
#   => DataDoP 는 SD 와 3.8% 안으로 붙고, **DL3DV 가 4.8배 높은 쪽 outlier** 다.
#   중앙값 정렬 gain 은 p95 를 넘치게 한다 (DataDoP sd 가 DL3DV 보다 커서 구조적으로 그렇다).
#   레벨을 더 붙이려면 gain 보다 **필터를 좁히는 게** 낫다: [0.02,0.5] 면 keep 75.0%,
#   sd 0.345 로 떨어지고 정렬 gain 4.56 에서 p95 1.581 (기존 2.235 대비 개선).
# index 필터 (m 기준). 기본값은 D='none' 스케일에 맞춘 값이다 — divisor 를 바꾸면 같이 바꿔야 한다.
#   실측(n=22314): [0.005,1.0] keep 91.3% (하단 7.43% / 상단 1.23%), 잔존 sd(log10 m) 0.685 -> 0.488
#   (DL3DV frontanchor 실측 0.285 쪽으로 접근). 참고 [0.002,1.0] 95.0%/0.545, [0.01,1.0] 86.5%/0.438.
datadop_norm_trans_min: 0.005 # 사실상 정지 shot 제거 (m→0 이면 궤적이 잡음뿐)
datadop_norm_trans_max: 1.0   # MonST3R 폭주 제거
datadop_window_stride: null   # null = shot 당 120프레임 **1 세그먼트**. 캡션이 shot 전체를
                              #   묘사하므로("정지 -> 좌측 이동 -> 복귀") 슬라이딩 윈도우는 캡션과
                              #   내용이 체계적으로 어긋난다. int 면 윈도우 모드.
datadop_index_workers: 24     # 인덱스 빌드 병렬도 (shot 당 json+depth 프로브; 전 코퍼스 ~10초)
datadop_letterbox: false      # [자리만] h ∈ {160..416} 이라 34% 가 종횡비가 크게 다르다. 지금은
                              #   비등방 resize (안전 근거: _geo_pixel_plucker 가 정규화 좌표에서
                              #   원본 K 를 다시 걸고, DA3 build_cam_token 의 fov 도 full-frame
                              #   resize 에 불변). letterbox 가 필요하다고 판명되면 여기에 붙인다.

# ===== [new 2026-08-16] 다중 코퍼스 혼합 (dataset_name: 'mixed') =====
# null 이 아니면 코퍼스 리스트. 각 원소:
#   {name: dl3dv|scene_decoupled|datadop, weight: 1.0, scale_gain: 1.0, override: {...}}
# MixedCamDataset 이 코퍼스마다 copy.deepcopy(cfg) 로 평평한 cfg 를 만들고 override 를 얹은 뒤
# **기존 클래스를 그대로** 생성한다 -> dataset_dl3dv.py / dataset_scene_decoupled.py /
# resolve_dataset_cfg 는 한 줄도 안 바뀐다.
#   override 화이트리스트: dl3dv_root, sd_root, sd_split, sd_geo_views, sd_pair_mode, datadop_*,
#     meta_csv, prompts_file, max_scenes, train_seg_list, test_seg_list,
#     coverage_blacklist_path, train_frac,
#     pose_source, avg_scale_ref, scale_mode, geo_view_sampling, geo_num_views, geo_cover_k,
#     geo_cover_radius, geo_cover_out_of_seg, geo_cover_before_only, geo_cover_centered_at_s,
#     geo_first_view_target_s
#   override 금지 (geo encoder 인스턴스가 하나라 토큰 수 P 가 상수여야 한다): geo_encoder,
#     geo_posed, geo_cam_embed, custom_geo_channels, geo_image_hw, custom_geo_input_hw,
#     da3_geo_input_hw, num_frames, intr_norm, trans_repr, cam_dim, vae_*, max_trans_norm
datasets: null
mix_val_interleave: true      # val 배치를 코퍼스 round-robin. val_max_batches 로 앞부분만 잘리므로
                              #   (train_latent_cam_dm.py:604-605) 이게 false 면 한 코퍼스만 평가된다.
mix_check_keys: true          # init 에서 코퍼스마다 item 0 을 한 번 뽑아 **key set 동일**을 확인한다.
                              #   collate_fn(base.py:148)이 batch[0]의 키만 순회해서, 키가 다르면
                              #   학습이 죽지 않고 텐서만 조용히 유실된다. 비용은 코퍼스당 item 1개.
# 모델이 보는 translation 크기 m = mean_t||t|| / norm_scale 에 거는 코퍼스 상수. 분모를 gain 으로
# **나눈다** -> m 이 gain 배가 된다. 걸리는 지점은 CamDataset._target_out 한 곳뿐이다.
# mixed 에서는 datasets[i].scale_gain 이 코퍼스 cfg 복제본의 이 키로 내려온다.
# !! `geo_encoder='da3' + geo_posed=true` 에서는 **켜면 안 된다** — dataset_mixed 가 raise 한다.
#    그 경로의 context 는 norm_scale 을 안 거친다: raw geo_c2w 를 내보내고(dataset_dl3dv.py:1437)
#    build_cam_token 이 DA3 자기 규약(median camera distance)으로 재정규화한다
#    (da3_geo_encoder.py:279-282). 즉 target 만 gain 배가 되고 context cam token 은 불변이라
#    context 가 함의하는 스케일과 target 크기의 대응이 코퍼스별 상수만큼 어긋난다 — 모델은 그
#    상수를 context 에서 못 읽고 추론엔 코퍼스 라벨이 없다. 균일 닮음변환으로 남는 것은 모든
#    채널이 같은 norm_scale 로 나눠지는 geo_custom(lagernvs) 경로뿐이다.
# **1.0 = 기존 동작과 bit-identical.** 혼합 arm 은 1.0 으로 간다 (2026-08-16 결정).
norm_scale_gain: 1.0
geo_encoder: lagernvs       # scene-context encoder: lagernvs (frozen VGGT recon -> 768-d tokens)
                              #   | custom (models/custom_geo_encoder.py: frozen DINOv2 + trainable
                              #     Plücker/depth tokenizer; RGBD 입력, custom_geo_* 참고)
                              #   | da3 (models/da3_geo_encoder.py: frozen Depth-Anything-3
                              #     cross-view ViT; RGB 만, 카메라는 DA3 cam_enc, da3_geo_* 참고)
                              #   | null (text-only)
train_frac: 0.9            # [new] random-split train share when train_seg_list/test_seg_list are null.
                          #   1.0 = use the WHOLE index for train and leave val empty; only for jobs that
                          #   never validate (the VAE fits, train_vae_dl3dv.py include_val=False).

geo_latent_dim: 768           # geo token dim (lagernvs = 768)
geo_num_views: 4              # #context views for 'even' sampling
geo_image_hw:                 # context image resolution fed to the geo encoder [H, W]
- 256
- 448
geo_view_sampling: even       # context-view selection: even (in-seg uniform) | frustum_cover (greedy coverage)
                              #   | hybrid (in-seg + covisibility) | random_inseg
geo_cover_k: 6                # frustum_cover: total #context views (incl. the fixed anchor)
geo_cover_radius: 2.5         # frustum_cover: coverage ball radius (× segment scale)
geo_cover_ndepth: 3           # frustum_cover: #depth samples along each ray for coverage scoring
geo_num_inseg: 3              # hybrid: #in-segment context views
geo_num_covis: 3              # hybrid: #covisibility-retrieved context views
geo_cover_out_of_seg: false   # frustum_cover: restrict candidates to OUT-of-target-segment frames (leakage-free)
geo_cover_before_only: false  # [new] out-of-seg context only from frames BEFORE the target segment (idx < s);
                              #   target must have earlier frames -> target = 2nd segment onward
geo_posed: false              # feed posed cam_token (context camera poses) to lagernvs; false = unposed
geo_lagernvs_skip_ctx_norm: false  # [new] skip lagernvs' own 1.35·max(context) norm; reuse target's initial
                              #   1.35·max_dist scale so target & geo latent share one frame+scale (full alignment)
geo_lagernvs_anchor: s        # [new 2026-08-03] scale_mode 'geo_lagernvs' 의 divisor 를 어느 카메라에서 재는가.
                              #   's'     (기본, 기존 동작) D = 1.35·max||c_geo - c_s||       — frame s 앵커
                              #   'view0'                   D = 1.35·max||c_geo - c_geo[0]|| — geo view0 앵커
                              # 왜 필요한가: geo_encoder.build_cam_token 은 항상 geo_idxs[0] 을 원점으로
                              #   재정렬한 뒤(models/geo_encoder.py:109-110) 1.35·max 로 나눈다. 그래서
                              #   override_scale=D 로 넣었을 때 LagerNVS 가 실제로 받는 스칼라
                              #   tok = max||c_geo - c_geo[0]|| / D 가 고유값 1/1.35 = 0.7407 이 되려면
                              #   D 도 geo_idxs[0] 앵커여야 한다. geo_first_view_target_s: true 면
                              #   geo_idxs[0] == s 라 두 앵커가 같은 점이고 값이 bit-identical -- 기존
                              #   arm B(geo_worldtraj_lagernvsnorm)가 tok 0.7407 을 그냥 얻던 이유가 이것.
                              #   false(camembed/decoupled)면 두 점이 달라져 실측 r = 1.35·max||·-c_geo[0]||/D
                              #   가 (0, 2] 로 흩어진다 (min 0.0420 / med 1.0997 / max 1.9985; 상한 2 는
                              #   c_geo[0] ∈ 집합 이라 삼각부등식에서 나오는 hard bound). 'view0' 이면 r ≡ 1.
                              # leak 없음: geo view 선택은 frame s 와 out-of-segment 프레임만 보므로 추론
                              #   시에도 동일하게 계산된다. target 궤적의 원점은 여전히 extrinsics[0] = c_s
                              #   이고 분모 스칼라만 바뀐다.
                              # !! geo_shuffle_order 와 병용 금지 (dataset 이 ValueError). 분모는 셔플 전
                              #   순서로 계산되는데 encoder 는 셔플 후 view0 을 보게 되어 앵커가 또 어긋난다.
geo_shuffle_order: false      # shuffle the geo context view order
geo_shuffle_keep_first: false # [new] when shuffling, keep view0 (anchor / frame s) fixed, shuffle only the rest
geo_first_view_target_s: false # geo view0 = target segment's FIRST camera (frame s) -> aligns geo latent frame
                              #   with the generation frame; remaining views are retrieved
geo_cover_centered_at_s: false # [renamed 2026-07-31 from geo_anchor_first_frame] honest frustum_cover: CENTER the
                              #   coverage ball on frame s (radius from context movement, never the unseen [s+1:e]).
                              #   This only steers WHERE the greedy search looks -- it never adds frame s (or any
                              #   target frame) to the encoder's context views; that is geo_first_view_target_s.
                              #   Verified: with geo_first_view_target_s false, view0 == frame s in 0/500 segments.
geo_cover_subtract_first: false # [new] subtract the fixed first-cam (s) coverage before the greedy pick, so the
                              #   remaining k-1 views maximize RESIDUAL coverage (what s doesn't already cover)
coverage_blacklist_path: null # per-segment coverage-blacklist CSV (columns scene,segment); null = no filtering
# [new] TEST-TIME probe: force K of the V context views to be TARGET-SEGMENT cameras (the frames
#   the model is asked to generate). null/0 = OFF, i.e. the sampler's pick is used unchanged.
#   The K views are evenly spaced over the target frames, so K=1 -> [s] exactly reproduces
#   geo_worldtraj's training condition (geo_first_view_target_s: true puts frame s in context and
#   geo_cover_out_of_seg: true keeps every other target frame out), K=3 -> [s, mid, last],
#   K=5 -> [s, 1/4, 2/4, 3/4, last]. They REPLACE the first K coverage views, so V is unchanged
#   and view0 is still s. Deliberate leakage: it asks whether the extra target views help and
#   whether the prediction collapses toward them. Setting it force-disables the geo latent cache
#   (the cache is keyed by segment, not by context view).
geo_test_inseg_k: null
# [new] TEST-TIME probe, orthogonal to geo_test_inseg_k: geo_test_inseg_k moves the context views
#   INTO the target segment (leakage axis); geo_swap_mode moves them to a DIFFERENT SEGMENT OF THE
#   SAME SCENE (context-content axis). Everything stays in-distribution -- same scene, same world
#   frame, real images, unchanged norm_scale -- so the only variable is WHICH REGION the context
#   covers. Reading: the predicted trajectory follows the donor region -> the model is
#   context-driven; it does not move -> text-driven. Also force-disables the geo latent cache.
#   null (default) = OFF | 'inscene' = donor is the (position + geo_swap_shift)-th other segment
#   of this scene (cyclic; scenes with a single segment are left unswapped and flagged
#   geo_swapped=0 in the batch so the analysis can drop them).
geo_swap_mode: null
geo_swap_shift: 1
geo_swap_keep_first: true     # put view0 back to the TARGET's frame s after the swap, so the anchor
                              #   -- and the frame/scale link to the generated trajectory -- is
                              #   untouched and only the other V-1 views move. false = swap all V
                              #   (confounds the probe with the geo_first_view_target_s ablation).
# [new] analysis side-channel: attach the chosen context view indices ('geo_idxs') and their c2w
#   ('geo_ctx_c2w', OpenCV) to every item so an offline script can measure how close the generated
#   trajectory sits to the context cameras. Never fed to the model. Off by default because on a
#   geo-latent-cache HIT it re-runs the frustum_cover search the cache exists to skip.
geo_return_idxs: false
# [new] per-context-view camera embedding channel-concatenated onto the geo tokens.
#   null (default) = OFF, i.e. the geo condition is exactly the (M, 768) LagerNVS tokens as before.
#   'relfirst'     = for each context view v build an 11-d pose relative to the TARGET segment's
#                    FIRST camera s -- rel = w2c_v @ inv(w2c_s), translation / norm_scale (the same
#                    divisor scale_mode gave the target), parametrized exactly like cam_param
#                    (rot6d = rel[:3,0] ++ rel[:3,1], trans = rel[:3,3], intr = fx/2cx, fy/2cy).
#                    The dataset appends those 11 raw dims to every patch token of that view, so
#                    geo_emb arrives as (M, 768+11); the MODEL splits them off, runs them through a
#                    trainable MLP (11 -> geo_cam_embed_dim) and concatenates, giving geo_proj an
#                    input of geo_latent_dim + geo_cam_embed_dim. Only the raw 11 dims are cached.
#   'plucker'      = same frame and units, but a 6-d Plücker ray PER PATCH TOKEN instead of one
#                    11-d pose per view: for patch (i,j) of view v, d = normalize(R^T K^-1 [x,y,1])
#                    and moment = o x d with o = -R^T t the camera center (both in frame s, t
#                    divided by the same norm_scale). geo_emb arrives as (M, 768+6) and the same
#                    trainable MLP (6 -> geo_cam_embed_dim) lifts it, so geo_proj input is
#                    unchanged at geo_latent_dim + geo_cam_embed_dim. Differences vs 'relfirst':
#                    the embedding VARIES WITHIN a view (each token gets its own ray, so a token
#                    knows which direction it looks at, not just which camera it came from) and
#                    there are no explicit intrinsics channels -- FoV is already in d. The patch
#                    grid is derived from geo_image_hw by the encoder's own resize rule
#                    (dataset_dl3dv._geo_patch_grid; (256,448) -> 21x37 = 777 per view) and
#                    attach_geo_cam asserts it against the real token count.
#   Intended for the ablation where the target's own first camera is NOT a context view
#   (geo_first_view_target_s: false): LagerNVS then anchors to an arbitrary context view, and this
#   embedding is what tells the model where each view sits in the generation frame.
#   Context intrinsics are kept RAW (fx/2cx, fy/2cy) regardless of intr_norm: under intr_norm 'rel'
#   the target's own intr channels are ~[1,1] by construction, so raw is the only way the context
#   FoV reaches the model. ('plucker' sidesteps this -- K enters through the ray directions.)
geo_cam_embed: null
geo_cam_embed_dim: 128        # width of the trainable MLP that lifts the raw dims (11 relfirst / 6 plucker)
# [new] precomputed frozen geo-latent cache (built by main/cache_geo_embeddings.py). null = OFF,
# i.e. the original behaviour: load context images and run LagerNVS every step. When set, the
# dataset loads <dir>/<first_cam_included|first_cam_not_included>/<iK>/<data_name>.pt instead and
# skips image I/O entirely; any segment missing from the cache silently falls back to the
# on-the-fly path, so a partial cache is safe. Valid ONLY because GeoEncoder.proj is nn.Identity
# for lagernvs (native 768 == geo_latent_dim 768) — with geo_latent_dim != 768 proj is a TRAINABLE
# Linear and its output must not be cached; dataset_dl3dv refuses the cache in that case.
# The cache is keyed by the geo context selection, so it is only valid for the experiment that
# built it (geo_worldtraj: frustum_cover + out_of_seg + subtract_first + anchor_first + posed).
geo_latent_cache_dir: null
# [new 2026-08-29] scene 키 **pre-ln** DA3 캐시 (scripts/data/cache_geo_raw_da3.py). null = OFF.
# 위 geo_latent_cache_dir 과 자르는 지점이 다르다:
#   geo_latent_cache_dir -> GeoEncoder.proj **뒤**. da3 는 ln+proj 가 학습 대상이라 못 쓴다
#                           (dataset_cfg.py:360 이 강제로 끈다).
#   geo_raw_cache_dir    -> DA3SceneEncoder 의 backbone 출력, `self.ln` **직전**. 여기서 위쪽은
#                           전부 requires_grad=False + 영구 eval 이라 얼려도 학습이 안 바뀐다.
# 파일 하나가 scene 하나다: <dir>/<scene_key>.pt = {'raw': (V,P,C) fp32, 'geo_idxs': (V,) int16,
# 'meta': {...}}. scene_key 는 data_name 의 마지막 '_<seg>' 를 뗀 것이다. dtype 이 fp32 인 이유:
# backbone 출력은 bf16 autocast 아래서도 fp32 다 (residual stream). bf16 으로 내리면 왕복에서
# ||d||/||a|| 1.8e-3 이 생겨 캐시 경로와 on-the-fly 경로가 갈린다.
# 성립 조건 (dataset_cfg 가 전부 검사하고, 하나라도 어긋나면 끈다):
#   geo_encoder='da3' / geo_view_sampling='context_uniform' (선택이 (s,e) 가 아니라 scene 만 봄)
#   geo_cam_embed=null / geo_shuffle_order=false / geo_swap_mode=null / geo_test_inseg_k=0
# Vista4D 처럼 "scene 1편 = 소스 영상, segment = 뱅크 변이" 인 코퍼스에서 변이 9,873개가
# scene 파일 52개를 공유한다 (~2.2 GB). 파일이 없는 scene 은 조용히 on-the-fly 로 떨어진다.
geo_raw_cache_dir: null
geo_raw_cache_preload: true   # __init__ 에서 전량 RAM 적재 (fork 로 worker 가 공유; false = 매번 read)
# [new 2026-09-18, D200] preload 를 **anonymous RAM 대신 mmap** 으로 한다. false 면 예전 그대로.
# 왜 필요해졌나: 위 주석의 "~2.2 GB" 는 Vista4D 52 scene 기준이다. dynpose 10,169 scene 은 같은
# 캐시가 **403 GB** 이고, preload 는 프로세스마다 한 벌씩 올린다 — arm 4개면 1,612 GB 로
# RAM 1,771 GB 를 넘겨 OOM 이다 (D200 1차 기동에서 각 208 GB 까지 오르는 걸 보고 중단).
# mmap 이면 같은 파일이 **page cache 한 벌**로 모든 arm 에 공유되고, 압박이 오면 커널이
# OOM 대신 회수한다. 텐서 내용은 동일(실측 torch.equal True)하고 fd 도 안 남는다
# (mmap 뒤 close; 10,169 파일 -> ~20k vma, max_map_count 65,530 이내).
# 대신 첫 접근이 page fault 라 Lustre read 가 샘플 단위로 흩어진다 — 캐시가 데워지면 사라진다.
geo_raw_cache_mmap: false
# [new 2026-09-19] 이 캐시가 **어느 dtype 으로 구워졌는지**. float32(기본) = 예전 그대로이고,
# 다른 dtype 파일은 "낡은 bf16 캐시"로 보고 조용히 무시한다 (그 판정이 원래 하드코딩이었다).
# bfloat16 으로 두면 bf16 캐시를 그대로 받는다. 왜: D200 은 step 의 62%가 loader 이고 그 안의
# 96%가 (V=6,P=576,C=3072) fp32 텐서 42 MB 를 collate 에서 stack + shm 으로 두 번 복사하는
# 비용이다. bf16 이면 그 두 memcpy 가 절반이 되고, 소비 지점(train_latent_cam_dm.py:77,
# infer_validation_sample.py:95)이 이미 `.to(device).float()` 이라 배선은 안 바뀐다.
# 대신 fp32 on-the-fly 와 **비트 동일하지 않다** (실측 상대오차 3.3e-3, bf16 상한 3.9e-3).
# 재굽기는 `main/convert_geo_raw_cache.py` (재추론이 아니라 순수 캐스트).
geo_raw_cache_dtype: float32
# [new 2026-09-06, D144] geo 토큰 per-view resampler. null = OFF = 예전 경로와 **비트 동일**
# (모듈 자체를 안 만들므로 state_dict 키도 안 늘어난다).
#   'perceiver' -> models/da3_geo_encoder.PerViewResampler 가 (B,V,P,3072) 을 (B,V,R,D) 로
#                  줄인다. **view 를 섞지 않는다** — molmo2 의 프레임 내 avg-pool 과 같은 제약.
# 왜: da3 arm 은 49프레임에서 6뷰만 솎아 쓰고(576패치 x 6 = 3456 토큰) molmo2 arm 은 49프레임을
# 전부 보되 프레임당 64토큰으로 풀링한다(3136 토큰). 토큰 예산은 같은데 "전 프레임을 본다"는
# 축이 da3 쪽에만 없었다. geo_num_views=49 + geo_resampler_tokens=64 로 두면 49*64 = 3136 으로
# molmo2 의 video 토큰 수와 정확히 같아지고 두 arm 이 같은 축에서 비교된다.
# resampler_dim == geo_latent_dim 이면 GeoEncoder.proj 가 nn.Identity 가 된다 (파라미터가 새로
# 생기는 게 아니라 3072->768 Linear 가 resampler 의 kv_in 으로 자리를 옮기는 것).
geo_resampler: null
geo_resampler_dim: 768
geo_resampler_tokens: 64      # view 당 latent 수 R
geo_resampler_heads: 8
geo_resampler_layers: 1
# [new 2026-09-03] PE-AV (facebook/pe-av-large) 스트림 = "video CA". 레이어 순서는
# text CA -> **video CA** -> geo CA 이고, video CA 는 self.layers 를 넓히는 게 아니라 별도
# self.video_layers 로 들어가므로 아래 4개가 전부 기본값이면 모델 state_dict 와 출력이 예전과
# **비트 동일**하다. 캐시는 main/cache_peav_embeddings.py 가 굽는다 (env vista4d — latentcam
# env 엔 xformers 가 없어서 PE-AV import 자체가 안 된다). 학습은 캐시만 읽으므로 상관없다.
#   peav_video_cache_dir -> <dir>/<scene_key>.pt = {'emb': (T,1792) fp16, 'frames': T}.
#                           PE-AV visual tower 는 프레임당 토큰 1개다 (공간은 내부 pooling).
#                           geo_raw_cache_dir 과 같은 scene_key 규약 + __init__ 전량 preload.
#   peav_text_cache      -> 파일 하나 = {'by_name','emb'(U,L,1024),'mask','text','template'}.
#                           캡션 중복이 심해서 dedup 후 인덱스로 참조한다.
peav_video_cache_dir: null
peav_text_cache: null
# [new 2026-09-18, D200] 위 두 캐시의 preload 를 **anonymous RAM 대신 mmap** 으로. false(기본) 면
# 예전 그대로다. `geo_raw_cache_mmap` 과 같은 이유의 같은 스위치 — 주석은 그쪽에 자세히 있다.
# 왜 필요해졌나: 위 설명의 "프레임당 토큰 1개"는 PE-AV 264 scene 기준이고, D200 의 molmo2 video
# 캐시는 10,169 scene / **305 GB** 다 (prefill.pt 19.95 GB / text.pt 7.65 GB 는 별도). preload 는
# 프로세스마다 한 벌이라 molmo2 arm 4개면 1,220 GB 이고, 여기에 geo_raw 403 GB 가 겹치면
# RAM 1,771 GB 를 넘겨 OOM 이다 (D200 1차 기동에서 실측).
# vma 예산: mmap 파일 하나당 ~2 vma 라 geo_raw + peav video = 10,169×2×2 ≈ 41k.
# `vm.max_map_count` 65,530 이내지만 여유가 크지 않다 — 캐시 파일 수가 더 늘면 다시 볼 것.
peav_cache_mmap: false
# [new 2026-09-14, D194] molmo2 캐시가 마지막 층(`emb`) 옆에 중간 층(`emb_l{N}`) 도 같이 들고
# 있을 때 어느 쪽을 먹일지 (`cache_molmo2_embeddings.py --extra_layer N` 으로 구운 경우).
# null(기본) = `emb` = 마지막 층(`ln_f` 이후) — 예전 arm 과 비트 동일.
# 숫자 N 이면 `emb_l{N}` = 블록 N 의 raw 출력(`ln_f` **이전**). 층마다 스케일이 크게 달라서
# (D194 실측: |x| p50 마지막 1.076 vs layer21 0.519) `peav_in_ln: true` 를 켠 채 써야 한다.
peav_layer: null
# [new 2026-09-06, D138] 캐시 커버리지 검사를 train/test_seg_list 안의 세그먼트로 좁힌다.
# 데이터셋은 prompts.json 을 전량 열거하고 base.py 가 **그 다음에** seg-list 로 Subset 을 뜬다.
# dd10 처럼 리스트가 코퍼스의 부분집합이면(dynpose d137: 10857 / 24371) 학습이 한 번도 안
# 건드리는 세그먼트까지 캐시에 있어야 한다고 우기며 FileNotFoundError 로 죽는다.
# false(기본) = 예전과 글자 그대로 같은 검사.
peav_seg_list_only: false
# video CA 자체의 on/off 겸 입력 차원. 1792 = pe-av-large visual tower per-frame 토큰.
# 0 (기본) 이면 video_layers/video_proj/mod3 가 아예 생성되지 않는다.
video_latent_dim: 0
# arm A 전용: PE-AV **text** 토큰(1024-d)을 같은 video CA 의 key/value **앞쪽**에 붙인다
# (`[NL text tokens | 49 frame tokens]`). text CA 는 그대로 umt5 struct 캡션이 맡는다.
# arm B (text_encoder: PEAV) 는 PE-AV text 가 이미 text CA 로 갔으므로 여기서는 false.
video_text_in_stream: false
# [new 2026-09-04] `video_text_in_stream: true` 일 때 text part 의 **입력 차원**.
# 1024 (기본) = PE-AV text tower — D117 arm A 와 비트 동일하다. D124 의 Molmo2 arm 은
# video/text 두 part 가 같은 LM hidden 이라 둘 다 2560 이다. video part 차원은
# `video_latent_dim` 이 정하고, 이 키는 앞쪽 text part 만 정한다.
video_text_dim: 1024
# [new 2026-09-03 / FIX-D117] PE-AV feature 를 proj 앞에서 LayerNorm 한다 (video / video_text /
# text_encoder=PEAV 의 text_proj). DA3 geo 가 `da3_geo_encoder.self.ln` 을 거치는 것과 같은 자리.
# 없으면 video_tok std 26 (text part 41) 대 text/geo 0.58 로 CA logit 이 포화해서 학습이
# loss ~1.0 (eps 예측 0) 에 갇힌다 — D117 두 arm 실패의 원인. umt5 arm 은 이 키와 무관.
peav_in_ln: true
# [new 2026-09-03 / FIX-D117] video CA 를 **0 초기화 residual gate** 로 붙인다.
# 기존 CA 블록은 `h = CA(...)` 로 잔차를 덮어써서(CrossAttention 이 norm(x+a) 를 반환) 스트림
# 하나당 x_t 성분이 층마다 한 번 더 깎인다. 3번째 스트림을 그렇게 붙였더니 두 arm 이 55/84
# epoch 동안 loss ~1.0 에 갇혔다. gate=0 이면 시작 시점 출력이 D108 과 비트 동일하고 필요한
# 만큼만 열린다. false = 예전(덮어쓰기) 동작. video_latent_dim=0 이면 이 키와 무관.
video_gate: true
# [new 2026-09-15, D195-A] readout transformer. 캐시 hidden state 를 LayerNorm+Linear 하나로
# video CA 에 바로 먹이는 대신, learnable query 가 [self-attn → cross-attn → MLP] 를 이만큼
# 반복해 요약하고 **그 출력이 CA 의 key/value 가 된다**. 0 (기본) = 모듈 미생성 → 기존 arm 과
# state_dict·동작 비트 동일. video_latent_dim=0 이면 이 키들과 무관.
peav_readout_layers: 0
# query 개수 = 요약 토큰 수. 49 = 소스 프레임 수라 query i 가 프레임 i 에 대응하고, 그래서
# aux head 가 프레임별 좌표를 그대로 뱉을 수 있다. 부수 효과로 video CA key/value 가
# 3264 → 49 로 줄어든다.
peav_readout_queries: 49
# >0 이면 readout 출력에 MLP head 를 달아 **프레임별 subject OBB center** 를 맞히게 한다
# (3 = xyz). 타깃은 target_track_dim 이 쓰는 것과 같은 `target_track.npz` 라 게이지가
# cam_param 과 일치한다 — 코퍼스에 그 파일이 없으면 손실이 조용히 None 이 되니 주의.
# head 출력은 DiT 로 되돌아가지 않으므로 추론에서 안 부르면 그게 곧 "MLP 를 뗀" 상태다.
peav_readout_aux_dim: 0
peav_readout_aux_w: 0.0       # 보조 손실 가중치. aux_dim>0 인데 0 이면 학습 진입점에서 assert.

# ─── [new 2026-09-20, D206] aim aux loss ─────────────────────────────────────────────────
# 학습 스텝 안에서 예측 x0 를 **궤적 VAE 로 디코드**해, 카메라 forward 와
# (카메라중심 -> subject OBB center) 벡터 사이 각을 좁히는 보조 손실.
# 바로 위 readout aux 와 다르다: 저쪽은 별도 head 가 subject 좌표를 맞히는 표현 손실이라
# DiT 출력에 닿지 않고, 이쪽은 **DiT 가 예측한 x0 자체**를 디코드하므로 궤적에 직접 기울기가 간다.
#   타깃 게이지: `target_track` (B,T,4)[xyz, valid] = frame-s 카메라 좌표 / avg_scale
#   예측 게이지: decode(x0_hat) 의 rot6d/t = rel_f = E_f @ inv(E_s), 같은 avg_scale 로 나뉨
#   => 분모까지 같은 자라 c = -R^T t 와 q 를 그대로 뺄 수 있다.
# 0.0 (기본) = 이 경로를 아예 안 탄다 -> 기존 arm 과 손실이 비트 동일.
# ⚠ target_track 을 쓰지만 **모델 입력이 아니다** (target_track_dim 과 무관, 네트워크 동일).
aim_loss_w: 0.0
# x0_hat = (x_t - sqrt(1-ᾱ)·eps_hat)/sqrt(ᾱ) 는 t 가 크면 1/sqrt(ᾱ) 가 폭발해(t=999 에서 ~30배)
# 디코드 결과를 궤적이라 부를 수 없다. 이 timestep **미만** 표본만 손실에 넣는다.
aim_loss_max_t: 250
# 어느 표본에 거나. 'look_at' = prompts.json 의 `aim=="look_at"` 인 변이만. (D194 실측:
# look_at 은 GT 각 중앙값 2.21~2.29°, >20° 가 0% — 손실이 이미 있는 규약을 강화한다.
# aim=free 는 GT 각이 27~32° 라 손실이 GT 와 싸운다.) 'all' = valid track 이 있는 전 표본.
aim_loss_gate: look_at

# ─── [new 2026-09-22, D261] start pose prediction ────────────────────────────────────────
# 데이터셋의 `cam_param` 은 `E @ inv(E[0])` 로 정규화돼 **frame0 이 항상 항등**이다.
# 즉 "타깃 궤적의 첫 카메라가 소스 카메라 대비 어디에 있는가"는 궤적 어디에도 안 남는다.
# 이 옵션을 켜면 dataset 이 `start_pose` (9,) = [rot6d, t/avg_scale] 를 따로 내고,
# DiT 는 시퀀스 끝에 토큰 1 개(T -> T+1)를 붙여 그 값을 회귀한다.
# false (기본) = 키도 안 생기고 토큰도 안 붙어 기존 arm 과 **비트 동일**.
start_pose_pred: false
start_pose_dim: 9             # rot6d(6) + trans(3). intr 은 이 코퍼스에서 상수라 뺐다.
start_pose_w: 0.0            # 회귀 손실 가중치. start_pose_pred=true 인데 0 이면 assert.
# teacher forcing: 학습 중 확률 p 로 GT start pose 를 토큰에 **더해서** 넣는다.
# 드롭은 element-wise 가 아니라 **표본 단위**(torch.rand(B,1,1)) — 드롭된 가지는
# 추론 경로(query 단독)와 비트 동일해야 하기 때문.
start_pose_tf_p: 0.0
start_pose_noise: 0.0         # 주입 전 GT 에 더하는 gaussian std (정규화 게이지 단위)
geo_inseg_span: null          # in-seg sampling span override (null = full segment)
geo_covis_radius: 2.0         # covisibility retrieval: ball radius
geo_covis_theta0: 10.0        # covisibility retrieval: min view-angle separation (deg)
geo_covis_max_axis_deg: 80.0  # covisibility retrieval: max camera-axis angle vs anchor (deg)
geo_covis_topM: 32            # covisibility retrieval: candidate pool size (top-M nearest)
lagernvs_repo_path: /data1/cympyc1785/LatentCamVid/camera_generation/tools/lagernvs    # lagernvs code (for geo encoder)
lagernvs_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/tools/lagernvs/checkpoints/lagernvs_general_512/model.pt  # lagernvs weights
scenetok_repo_path: null      # alternative scenetok encoder repo (null = unused)
scenetok_ckpt_path: null      # scenetok checkpoint (null = unused)
# [new] geo_encoder: custom — models/custom_geo_encoder.py (frozen DINOv2 + trainable
#   GeoTokenizer(Plücker+depth)). lagernvs 와 달리 TRAINABLE 이고 batch dict 을 받는다.
custom_geo_dino_path: null    # null -> <ckpt_root>/dinov2-large (Dinov2Model, ViT-L/14, hidden 1024)
custom_geo_freeze_dino: true  # false 로 열면 DINO 파라미터도 optimizer 에 넣어야 한다
custom_geo_input_hw: null     # null -> geo_image_hw 를 patch(14) 배수로 내림 ((256,448) -> (252,448) = 18x32 = 576 tok/view)
custom_geo_ray_dim: 64        # GeoTokenizer 의 Plücker linear-patchify 채널
custom_geo_geo_dim: 256       # GeoTokenizer 전체 출력 채널 (ray + stem)
custom_geo_patch: 14          # dataset 이 격자 정합성을 검사할 때 쓰는 patch (DINOv2 ViT-L/14)
# <scene>/da3/depth.npz 를 비압축 .npy 로 풀어 둔 캐시 (scripts/data/cache_da3_depth.py).
# npz 는 deflate 라 6 장만 필요해도 scene 전체를 풀어야 해서 0.62 s/item; 캐시 mmap 은 0.02 s.
# null 로 두면 npz 폴백이라 결과는 같고 느리기만 하다.
custom_geo_depth_cache_dir: /data1/cympyc1785/data/DL3DV/scenes/da3_depth_raw
# [ablation 2026-08-10] GeoTokenizer 에 무엇을 넣을지. full 이 기존 동작 그대로다.
#   full     Plücker(6) + log-depth(1) + valid(1)  <- 기본. 기존 run 과 완전히 동일한 경로
#   no_depth Plücker(6) 만. stem 의 첫 conv in_ch 만 8->6 이고 폭/구조는 그대로
#   rgb_only GeoTokenizer 자체를 제거 -> frozen DINOv2 특징만 proj(1024->geo_latent_dim)
# rgb_only/no_depth 는 dataset 에서 안 쓰는 텐서를 아예 만들지 않는다 (depth I/O 절약).
custom_geo_channels: full

# [new 2026-08-12] geo_encoder: da3 — models/da3_geo_encoder.py.
#   frozen Depth-Anything-3 cross-view ViT + trainable LayerNorm (768 로 내리는 Linear 는
#   GeoEncoder.proj). custom 과 다른 점:
#     - 입력이 RGB 뿐이다. Plücker/log-depth/valid 를 안 만들어서 dataset I/O 가 줄어든다.
#     - 카메라는 픽셀 ray 가 아니라 DA3 자신의 cam_enc 로 넣는다 (geo_posed: true 일 때).
#       정규화도 DA3 규약(view0 재고정 + camera center 거리 median)이라 norm_scale 과 무관하다.
#     - view 순서가 의미를 갖는다 (view0 = reference) -> geo_shuffle_order 와 병용 금지.
#   vendored tools/Depth-Anything-3 는 읽기 전용이다 (수정 0줄). api.py 를 import 하지 않고
#   registry+safetensors 로 backbone/cam_enc 만 올린다 — 이유는 da3_geo_encoder.py docstring.
da3_geo_repo_path: /data1/cympyc1785/LatentCamVid/camera_generation/tools/Depth-Anything-3
da3_geo_model: da3nested-giant-large   # DA3 registry key (configs/*.yaml 의 stem).
                              #   nested 는 anyview 갈래만 올린다 (metric 갈래는 depth 스케일
                              #   정렬 전용이라 feature 에 관여하지 않는다). corpus
                              #   <scene>/da3/*.npz 를 만든 바로 그 모델. vitg embed 1536,
                              #   cat_token -> native 3072, backbone+cam_enc 1251 M (frozen).
                              #   더 가벼운 대안: da3-large (vitl, native 2048, 355 M).
da3_geo_ckpt_path: null       # null -> da3_geo_hf_home 의 HF 캐시 snapshot/model.safetensors
da3_geo_hf_home: /data1/cympyc1785/cache/huggingface
da3_geo_input_hw: [252, 448]  # patch(14) 배수. DA3 native 는 280x504 지만 252x448 은 그것의
                              #   등방(x8/9) 축소라 aspect 왜곡이 없고 custom backend 와 같은
                              #   격자(18x32 = view 당 576 토큰)다. 해상도 probe 결과:
                              #   results/20260812_da3_res_probe_giant (448 vs 504 AbsRel
                              #   0.0176~0.0564, delta<1.25 0.958~0.9995)
da3_geo_layers: last          # last | all — out_layers 4개 중 마지막만 / 전부 concat(4x3072)
da3_geo_layer_fuse: concat    # (all 일 때) 현재 concat 만 구현
da3_geo_norm: ln              # ln | none. cat_token 의 두 반쪽은 앞이 un-normed local_x,
                              #   뒤가 norm 통과라 분산 스케일이 크게 다르다. 끄면 한쪽이 먹는다.
da3_geo_debug: false
# [new 2026-08-29] cam_enc(pose token) 을 샘플별로 부를지. false = 기존 동작(배치 통째로 한 번).
# 수학적으로는 배치가 안 섞이는데도 B>1 이면 cuBLAS 가 다른 kernel 을 골라 cam_token 이 rel 2.9e-7
# 달라지고, cam_token 이 x[:, :, 0] 에 꽂혀 전 view 가 attend 하는 자리라 DA3 backbone 이 그걸
# pre-ln 토큰에서 rel 2.3e-2 (token cos 평균 0.9997 / 최소 0.968) 로 증폭한다. 즉 끄면 같은
# 샘플이 batch_size=8 학습과 batch_size=1 추론에서 다른 geo token 을 본다. 켜면 배치 크기에
# 완전히 불변 (max|d| 0). 비용은 B=8 에서 cam_enc 3.3 -> 26.1 ms, backbone 468 ms 대비 +4.9%.
# geo_raw_cache_dir 을 쓸 때는 캐시가 B=1 로 구워지므로 **true 여야** 두 경로가 일치한다.
da3_cam_token_per_sample: false
# [new 2026-08-16] geo_encoder=da3 + geo_posed=true 는 기본적으로 pose_source='da3' 를 요구한다
#   (dataset_cfg.py 의 raise — da3 코퍼스 arm 에서 pose_source 를 빠뜨리는 오타를 잡는 가드다).
#   true 로 켜면 transforms(COLMAP) pose 코퍼스로도 돌린다. 안전한 이유:
#     * DA3 cam_enc 는 view0 재고정 + **per-sample median camera distance** 로 정규화하므로
#       (da3_geo_encoder.build_cam_token) 포즈의 절대 스케일에 불변이다.
#     * da3 backend 는 디스크 depth 를 안 읽는다 (geo_logd/geo_valid 는 geo_custom 분기 전용,
#       dataset_dl3dv.py:1417-1423) -> 섞일 스케일 공간 자체가 없다.
#   custom backend 는 여전히 pose_source='da3' 를 강제한다 (ray x depth 가 같은 공간이어야 함).
da3_geo_allow_transforms_pose: false

# --- geo cross-attention tracking (val 때만, 첫 배치 하나) ------------------------
# 켜면 wandb 에 val/geo/* 스칼라와 val/geo/attn_map 이미지가 올라간다. 기본 off 라
# 기존 run 은 코드 경로가 바뀌지 않는다. forward 2회 추가라 비용은 무시할 수준.
#   resid_ratio_l{i}  geo cross-attn 의 ||a||/||x||. attention 은 softmax 라 행 합이 항상
#                     1 이므로 "geo 를 얼마나 쓰는가"는 attention map 이 아니라 이걸로 본다.
#   attn_entropy_norm 1.0 = geo 토큰에 완전 균일(= patch 를 고르지 않음), 낮을수록 집중.
#   dpred_shuffle     geo 를 배치 축으로 roll(1) 했을 때 출력 변화율. geo 를 실제로 쓰는지의
#                     직접 지표 (토큰 통계는 그대로 두고 scene 짝만 깬다). 0 이면 안 쓰는 것.
#   view_mass_v{i}    view 별 attention 질량 (균일 = 1/V)
log_geo_attn: false
log_geo_attn_every: 5         # 이 주기(epoch)마다 attn_map 이미지도 같이 올린다 (스칼라는 매 val)
log_geo_attn_timestep: 500    # 고정 timestep + 고정 seed noise -> epoch 간 비교 가능

# 여기 든 epoch 은 ckpts/epoch<N>.pth (+ custom geo 면 epoch<N>_geo.pth) 로 따로 박아 둔다.
# best/last 는 계속 덮어써지므로 학습 중간 지점의 모델을 나중에 볼 유일한 방법이다.
# 빈 리스트면 기존 동작 그대로 (best/last/resume 만).
ckpt_at_epochs: []

# [new 2026-08-09] 위와 같은 일을 **주기적으로** 한다. 예: 50 -> epoch 50,100,150,... 에서
# ckpts/epoch<N>.pth 를 남긴다. 파일명 규약은 ckpt_at_epochs 와 동일(N = 0-based 루프 변수)이라
# 두 설정이 같은 epoch 을 가리키면 같은 파일 하나가 된다. epoch 0 은 건너뛴다.
# null 이면 기존 동작 그대로 (ckpt_at_epochs 만).
ckpt_every_epochs: null
clip_version: ViT-B/32
clip_max_length: 77
# config_large.py's CLaTr ckpt. It is an architecture-identical drop-in to the
# clatr_epoch109_dl3dv_seg_2.ckpt all our earlier runs used (same 260-key state_dict, no shape
# mismatch, both 191,546,118 B; CLaTr's input standardization comes from
# evaluate/CLaTr/configs/dataset/standardization/0120.yaml, not from the ckpt) but it is trained on
# a DIFFERENT corpus — so FD / PRDC / clatr_score from runs using this ckpt are NOT comparable with
# any number in EXPERIMENTS.log before 2026-07-30. Only compare epoch139-vs-epoch139.
clatr_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/checkpoints/clatr_epoch139_large.ckpt
# `src.extraction` 이 쓸 standardization config 이름. null 이면 기존 동작 그대로
# (config_eval.yaml 의 `dataset: traj+caption_eval` -> 0120, num_cams 120).
# **clatr_ckpt_path 를 49프레임 코퍼스 ckpt 로 바꾸면 이것도 같이 바꿔야 한다** —
# num_cams 는 padding 길이라 (trajectory_dataset.py:180) 49프레임으로 학습한 CLaTr 에
# 120 을 주면 71프레임이 zero-pad 로 따라 들어간다. d200 ckpt 는 `dynpose49_d200`.
clatr_standardization: null
