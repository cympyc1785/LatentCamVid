# @package _global_
# D131 — `vista4d_d121_da3_t128.yaml`(D123) 재실행, **코퍼스 경로 3줄만** 다르다.
#
# ═══ 왜 도나 ═════════════════════════════════════════════════════════════════════════════
# D128 뱅크(#165) 와 그 export(#166) 는 끝나 있는데 그걸 쓴 학습이 **하나도 없었다**
# (`main/conf/` 전체 grep: d121 16회 / d77 9회 / dynpose_d107 17회 / dynpose_d110 4회 /
#  **k6_d128 0회**). 즉 D128 에서 바뀐 것들이 아직 한 번도 학습 신호로 안 들어갔다:
#   · `--tau_ref follow`      track_* 의 τ 를 follow 궤적 기준 상대량으로 (D97)
#   · `track_min_drift_u`     추종 궤적이 사실상 정지인 조합 제거
#   · anchor 3/3             dynamic 3 + static 3 상한 (벽·바닥 target 금지)
#   · `drop_surfaces`        정적 anchor 에서 면(벽/바닥) 제외
#   · tracking lock 1.0      drift 0.6 -> lock (D126, 사용자 지시)
#   · `min_zcam`             카메라가 subject 뒤로 파고드는 조합 차단
#
# ═══ 대조군 ══════════════════════════════════════════════════════════════════════════════
# D123(`vista4d_d121_da3_t128`, run ol2mue8s, epoch100) 이 **같은 모델·같은 text_len 128·
# 같은 4개 holdout 씬**의 구 코퍼스 판본이다. 아래 3줄 외에는 글자 그대로 같다.
#
# ═══ 코퍼스가 작아진다 — eval 수치 직접 비교 금지 ═══════════════════════════════════════
#   train  14,975 -> 9,389 entry  (-37.3%)
#   test      875 ->   592 entry  (-32.3%)
#   씬 구성은 같다 (train 48 / test 4: avocado-slice · bmx-bumps · camel · couple-hug).
#   다만 test 씬별 entry 수가 266/220/325/64 -> 150/180/198/64 로 바뀌었다. 게이트가
#   **걸러낸 부분집합**이지 재추출이 아니므로, 두 arm 의 testset 지표는 분모가 다른 표본
#   위에서 잰 값이다. 코퍼스 간 평균 비교 대신 **d128 test 592 entry 위에서 두 ckpt 를
#   같이 돌려** 짝지어 비교할 것.
#
# ═══ molmo2 arm 은 아직 못 돈다 ═════════════════════════════════════════════════════════
# d128 코퍼스에는 `molmo2_cache/` 와 `peav_cache/` 가 없다 (d121 에만 있다). video CA arm
# 을 d128 로 돌리려면 캐시를 먼저 다시 구워야 한다 — 이번 arm 은 da3 단독이다.
exp_name: vista4d_d128_da3_t128
dl3dv_root: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d128
meta_csv: meta_vista4d.csv
train_seg_list: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d128/seg_list_vista4d_train.txt
test_seg_list: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d128/seg_list_vista4d_test.txt
coverage_blacklist_path: null

text_len: 128   # D123 과 동일. conf/config.yaml:196 기본값 512 를 덮는다.

pose_source: da3
target_pose_source: da3_target_poses   # target 만 <scene>/da3/target_poses.npz 로 교체
scale_mode: avg_scale
avg_scale_ref: context_first_cam       # 디렉토리 avg_scale_context_first_cam <- scene_graph S
intr_norm: rel                         # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                            # = 그 ckpt 의 latent_dim

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last

geo_view_sampling: context_uniform  # context range = 영상 전체 [0,49) = 소스 영상 전체
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true       # view0 = 프레임 s(=0). 이미 첫 픽이라 집합이 안 바뀐다.

# 소스 프레임은 d121 과 같은 52편이라 geo raw 캐시를 그대로 재사용한다
# (캐시 키는 scene/frame 이고 코퍼스 판본과 무관하다).
geo_raw_cache_dir: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3/geo_raw_cache_da3
da3_cam_token_per_sample: true   # 캐시는 B=1 로 구워진다 — 켜야 on-the-fly 폴백과 일치

anchor_pred_frame0: true

video_latent_dim: 0   # video CA 블록 자체를 만들지 않는다 (D117 이전과 비트 동일)

batch_size: 8
epochs: 100
ckpt_at_epochs: [50, 100]
