# @package _global_
# VARIANT A — unified ctx_longer_135max normalization.
# Everything is geo_worldtraj except the normalization, which is made ONE scale for both sides:
#   target views  : scale_mode=ctx_longer_135max  -> D = mean over the CONTEXT RANGE's
#                   non-overlapping 49-frame windows of 1.35*max||center - window's first center||
#   context views : geo_lagernvs_skip_ctx_norm=true -> LagerNVS's own
#                   1.35*max||ctx center - ctx view0 center|| is REPLACED by the same D
#                   (train_latent_cam_dm.geo_encode passes it as override_scale).
# Why this divisor: it removes the BETWEEN-SCENE arbitrary COLMAP scale best of the leakage-free
#   candidates. Over 39817 post-blacklist segments / 6095 scenes, log10 of the normalized reach
#   m = max||target view center - frame s|| / D, split into scene-mean (between) and
#   scene-internal (within) parts:
#              sd(log10 m)  between  within | corr_btw  corr_wth
#     no norm     0.2074     0.1340  0.1573 |    -         -
#     THIS (A)    0.1864     0.0228  0.1850 |  0.986    -0.544     between -83.0%
#     geo_lagernvs 0.1890    0.0525  0.1816 |  0.923    -0.080     between -60.8%
#     avg_scale   0.3073     0.2631  0.1577 |  0.101     0.080     between +96.4% (WORSE)
#   between-scene spread is the pure nuisance (each scene's COLMAP scale is arbitrary) and is what
#   this is for; the within-scene spread is real signal ("this segment moves more") and should NOT
#   be cancelled -- so the total sd is the wrong figure of merit. D here is retrieval-INDEPENDENT
#   (whole context range), unlike geo_lagernvs whose D depends on which context views get picked;
#   the cost is corr_wth -0.544, a structural artifact of context range = target segment's complement.
#   ctx_side_135max (same 1.35*max over the WHOLE context range without windowing) is worse than
#   not normalizing at all.
#   D distribution: min 0.4987 p0.1 1.890 med 5.382 -- the clamp(min=1e-5) never binds (0 segments).
#   Windowing to num_frames is what puts D in LagerNVS's own units: render probe cam_scale
#   med 0.9602 (native 0.7407) and -1.576 dB vs -4.025 dB for ctx_side_135max.
#
# !! The geo latent cache CHANGES with this run: override_scale alters the cam_token, so the
# geo_emb differs from the first_cam_included cache built for geo_worldtraj. This config points
# at its OWN cache dir, rebuilt by cache_geo_embeddings.py with CACHE_EXP=geo_worldtraj_ctxlonger135.
exp_name: dl3dv_geo_worldtraj_ctxlonger135
meta_csv: meta_worldtraj.csv
coverage_blacklist_path: null
geo_encoder: lagernvs
geo_view_sampling: frustum_cover
geo_cover_out_of_seg: true
geo_first_view_target_s: true
geo_cover_subtract_first: true
geo_cover_centered_at_s: true
geo_posed: true
scale_mode: ctx_longer_135max
geo_lagernvs_skip_ctx_norm: true
cam_dim: 64
intr_norm: rel              # [2026-08-01] see below -- shared with the baseline now
# [2026-08-01] VAE switched from the per-scale_mode refit my_checkpoints/vae_ctxlonger135 to the
# BASELINE's checkpoints/vae_20260302_300, and intr_norm raw -> rel, so this arm, arm B
# (geo_worldtraj_lagernvsnorm) and the baseline (geo_worldtraj) share ONE camera VAE and ONE
# intrinsics convention. That leaves scale_mode + geo_lagernvs_skip_ctx_norm as the ONLY
# difference vs the baseline -- previously the arms also differed in VAE ckpt, in intr_norm, and
# in whether vae_latent_scale was even correct, so nothing could be attributed to normalization.
# Not a compromise: scripts/vae/vae_scale_matrix.py (1264 samples / 200 scenes, intr rel) says
# vae_20260302_300 has the LOWEST trans recon L1 in every scale_mode, including this arm's --
#   ckpt                 scale_mode          rot      trans    intr_L1
#   vae_20260302_300     ctx_longer_135max   0.00569  0.00455  0.00263   <-- active
#   vae_ctxlonger135     ctx_longer_135max   0.02569  0.03545  0.26623   (rel; it was fit raw)
#   vae_ctxlonger135     ctx_longer_135max   0.00534  0.00666  0.00361   (raw = the old setting)
# i.e. the 60-epoch DL3DV-only refit is simply underfit (rot L1 4-5x) and the shared ckpt beats it
# on its own scale_mode. Intrinsics are 'rel' by standing decision (DL3DV intrinsics are constant
# per scene -> rel makes cam_param[9:11] exactly [1,1]).
# vae_latent_scale = the MEASURED latent std of this (ckpt, scale_mode, intr_norm) triple, so
# `encode(traj) / vae_latent_scale` reaches the diffusion model at ~unit std. Measured over the
# FULL corpus (MAX_SCENES unset -> 39817 segments / 6095 scenes; recon L1 rot/trans/intr
# 0.00619 / 0.00495 / 0.00277). The script's MAX_SCENES=200 default reads 4-7% LOW on every
# scale_mode (0.55882 here) -- systematic, that subset is low-motion; do not use it.
# Superseded: vae_ctxlonger135 @ raw measured 0.584795 (train_frac 1.0) / 0.562833 (0.9).
vae_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/checkpoints/vae_20260302_300.pth
vae_latent_scale: 0.58341
geo_latent_cache_dir: /data1/cympyc1785/data/DL3DV/latent_cache_ctxlonger135
