# @package _global_
# text-only with SCVideo config_large.py's normalization: camera translations divided by the
# stored point-cloud avg_scale (scale_mode=avg_scale) + intrinsics divided by frame 0
# (intr_norm=rel) — the exact pipeline vae_20260302_300 was fit with
# (SCVideo config_large.py + data/dataset_large.py:295-304 and :313). The plain dl3dv_textonly had used
# camera-based cam_dist_mean, which diverged from the port origin. Same base/loss as
# dl3dv_textonly otherwise; the VAE triple (vae_20260302_300 / cam_dim 64 /
# vae_latent_scale 0.96032625) comes from config.yaml — see its comment for the measured matrix
# and for why 0.96032625 leaves the DL3DV-only diffusion input std at 0.4654, not 1.0.
# intr_norm/cam_dim are pinned here rather than left at the default so the ckpt<->convention
# pairing survives future default changes.
exp_name: dl3dv_textonly_savedscale
geo_encoder: null
scale_mode: avg_scale
intr_norm: rel              # vae_20260302_300 is a frame-0-relative-intrinsics ckpt
cam_dim: 64                 # = that ckpt's latent_dim (strict load crashes otherwise)
# Corpus = meta_worldtraj.csv (DL3DV 1K-7K, 6098 scenes), the same scene list every other
# worldtraj-scoped run uses (textonly_align, geo_worldtraj*, vae_worldtraj) so the numbers stay
# comparable with them. Segment-level coverage_blacklist_path stays null (that filter scores
# geo context coverage, which is meaningless without a geo encoder). The scene-level
# blacklist.csv (295 scenes) needs no flag: meta_worldtraj.csv already excludes all of them and
# dataset_dl3dv re-applies it unconditionally at index build.
meta_csv: meta_worldtraj.csv