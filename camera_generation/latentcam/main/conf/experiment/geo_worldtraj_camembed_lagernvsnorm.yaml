# @package _global_
# camembed × arm B — geo_worldtraj_camembed 의 decoupled context 위에 arm B 의 normalization 통일
# (scale_mode geo_lagernvs) 를 얹는다. 목적은 geo_worldtraj_camembed_ctxlonger135.yaml 과 같다:
# camembed arm 에서 "normalization 미통일" 변수를 제거해 context decoupling 만 남긴다.
#
# !! arm B 와 달리 여기서는 geo_lagernvs_skip_ctx_norm 을 **true** 로 둔다. 원래 arm B
# (geo_worldtraj_lagernvsnorm)는 skip_ctx_norm false, 즉 LagerNVS 가 제 방식대로 정규화하게
# 두는데도 통일이 됐다 — geo_first_view_target_s 가 true 라 geo view0 == frame s 이고
# (dataset_dl3dv.py:694,707-709), 그러면 LagerNVS 의 1.35·max‖center − c_view0‖ 와
# _geo_lagernvs_scale 의 1.35·max‖c_geo − c_s‖ 가 **같은 값**이 되기 때문이다. 값의 우연이지
# 구조가 아니다. camembed 는 geo_first_view_target_s false 라 view0 ≠ s 이고, 실측(train 1500)에서
# 두 분모의 비 r = D_lagernvs/D 가 min 0.0420 / p05 0.5039 / median 1.0997 / p95 1.8912 / max 1.9985
# 로 흩어진다 (|r−1|≤1e-4 인 segment 0.13%; 대조군 geo_worldtraj 는 100.00%). 그래서 여기서
# skip_ctx_norm 을 false 로 두면 통일이 아예 성립하지 않는다. true 로 override_scale=D 를 강제해야
# arm A 와 같은 구조적 통일이 된다.
#
# 알려진 부작용 (실측, train 1500 segment):
#   LagerNVS 에 실제로 들어가는 스칼라 tok = max‖c_ctx − c_view0‖ / D 는 고유값 0.7407 과 어긋난다:
#   p01 0.1520 / median 0.8146 / max 1.4804, tok < 0.7407 인 비율 36.80%, 심한 축소 2.67%.
#   같은 조건의 arm A 는 16.00% / 1.73% 라 이 arm 쪽이 더 자주 축소된다. D 가 frame s 앵커인데
#   LagerNVS 는 view0 앵커라서 생기는 차이고, camembed 에서는 구조적으로 피할 수 없다.
#
# cache: geo_first_view_target_s false → subdir first_cam_not_included/. override_scale 이
#   geo_lagernvs 라 native 정규화와도, arm A 의 ctx_longer_135max 와도 값이 달라 기존 두 트리를
#   재사용할 수 없다 → 전용 트리 latent_cache_geolagernvs 를 새로 굽는다.
#   (geo_first_view_target_s true 였다면 native 와 값이 같아 latent_cache/first_cam_included 를
#    그대로 쓸 수 있었다. 그게 원래 arm B 가 캐시를 공유하던 이유다.)
# vae_latent_scale / seg_list 고정 근거는 geo_worldtraj_ctxlonger135_scale96.yaml 주석 참조.
exp_name: dl3dv_geo_worldtraj_camembed_lagernvsnorm
meta_csv: meta_worldtraj.csv
coverage_blacklist_path: null
geo_encoder: lagernvs
geo_view_sampling: frustum_cover
geo_cover_out_of_seg: true
geo_first_view_target_s: false
geo_cover_subtract_first: false
geo_cover_centered_at_s: true
geo_posed: true
geo_cam_embed: relfirst
geo_cam_embed_dim: 128
scale_mode: geo_lagernvs
geo_lagernvs_skip_ctx_norm: true
cam_dim: 64
intr_norm: rel
vae_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/checkpoints/vae_20260302_300.pth
vae_latent_scale: 0.96032625   # baseline c4d2k5y4 / camembed ek9n9jt5 와 동일
geo_latent_cache_dir: /data1/cympyc1785/data/DL3DV/latent_cache_geolagernvs

train_seg_list: /data1/cympyc1785/data/DL3DV/scenes/latentcam_train_seg_list_c4d2k5y4.txt
test_seg_list: /data1/cympyc1785/data/DL3DV/scenes/latentcam_test_seg_list_c4d2k5y4.txt
