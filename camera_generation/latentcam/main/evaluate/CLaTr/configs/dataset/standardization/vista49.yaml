# vista d128 코퍼스(49프레임) 용 standardization.
#
# 0120.yaml 은 E.T./ArtTraj 게이지다 — num_cams 120, shift_std ~[1.13, 1.19, 1.59].
# 우리 target 궤적은 49프레임이고 world 단위도 훨씬 작다(아래 값 참조). 그 config 로
# 학습한 CLaTr 로 우리 캡션 지표를 재는 건 남의 자로 재는 것이라 이 파일을 만든다.
#
# num_cams 는 padding 길이다 (trajectory_dataset.py:180 이 이 길이까지 zero-pad 하고
# padding_mask 를 만든다). 우리 궤적은 전부 정확히 49프레임이라 padding 이 0 이 된다.
#
# norm_*/shift_* 는 `prepare_clatr_vista.py --print_stats` 로 **우리 train split
# 9389개**에서 실측한 값이다 (velocity 표기: 첫 프레임 = 절대 위치, 이후 = 프레임 차분).
# 주의 — 현재 `trajectory_dataset.py:43` 이 `self.standardize = False` 로 못 박아 두어
# 이 통계는 학습에 쓰이지 않는다. 그래도 남의 코퍼스 숫자를 그대로 물려두면 나중에
# standardize 를 켜는 순간 조용히 틀리므로 우리 값을 적어 둔다.

name: 'vista49'
num_interframes: 0
num_cams: 49
num_total_frames: ${eval:'${dataset.standardization.num_interframes} * (${dataset.standardization.num_cams} - 1) + ${dataset.standardization.num_cams} '}

norm_mean: [-0.00143767, -0.00421090, -0.00921217]
norm_std: [0.06013537, 0.02246761, 0.04780878]

shift_mean: [0.03134345, -0.02311044, 0.07673862]
shift_std: [0.38921445, 0.08187350, 0.22635623]

velocity: true
