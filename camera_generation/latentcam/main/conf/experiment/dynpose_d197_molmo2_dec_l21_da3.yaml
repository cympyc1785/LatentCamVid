# @package _global_
# D197-d — `dynpose_d197_molmo2_dec_da3.yaml` 과 **한 줄만 다른** 사본: decode 스텝 hidden 을
# 마지막 층이 아니라 `blocks[21]` 의 raw 출력에서 가져온다.
#
# 캐시는 다시 굽지 않는다 — `cache_molmo2_embeddings.py --decode_tokens 128 --extra_layer 21`
# 이 두 층을 같은 파일(`text_decode.pt`)에 넣어 두고, `peav_layer` 가 읽는 키(`emb` vs
# `emb_l21`)만 바꾼다. 슬롯 기준이 같아서 prefill 세대의 ②↔③ 대조와 축이 정확히 맞는다.
#
# ⚠ 두 층은 스케일이 다르다 — `peav_in_ln: true` 가 부모에 켜져 있어야 proj 이 흡수한다.
defaults:
  - dynpose_d197_molmo2_dec_da3

exp_name: dynpose_d197_molmo2_dec_l21_da3
peav_layer: 21             # ← 부모와의 유일한 차이. null 이면 마지막 층(ln_f 이후).
