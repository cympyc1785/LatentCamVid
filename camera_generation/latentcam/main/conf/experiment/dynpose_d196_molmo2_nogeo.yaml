# @package _global_
# D196 — `dynpose_d194_molmo2_nogeo.yaml` 과 **캡션 한 축만** 다른 사본 (사용자 지시 2026-09-15).
# 캡션을 어떻게 다시 구웠는지 / 왜 코퍼스를 다시 export 안 하는지 / text_len 근거는
# `dynpose_d196_da3.yaml` 머리말 참조.
#
# ⚠ 여기서 바뀌는 건 **umt5 가 읽는 문장 하나뿐**이다. molmo2 스트림의 텍스트는
# `--text_override_json` 의 `Track {target_text}.` 이고, `target_text` 는 6,894/6,894 세그먼트
# 에서 d194 와 **바이트 단위로 같다** (같은 D193 `instance_desc.json` 에서 왔다). 그래서
# `molmo2_cache/text.pt` 를 다시 굽지 않는다 — 캐시가 이 arm 에도 그대로 유효하다.
defaults:
  - dynpose_d194_molmo2_nogeo

exp_name: dynpose_d196_molmo2_nogeo
prompts_file: prompts_mag.json   # ★ d194 arm 과의 유일한 차이
