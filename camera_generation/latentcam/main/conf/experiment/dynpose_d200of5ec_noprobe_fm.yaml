# @package _global_
# D298 (R109) — of5ec noprobe overfit 을 rectified flow 로 (사용자 2026-09-29 "rectified flow matching으로도 overfit 학습").
# 부모 dynpose_d200of5ec_noprobe_cos (D297: cosine LR warmup 500 → min 0.05, 100 epoch) 와의 차이는 objective 뿐:
#   x_tau=(1-tau)x0+tau eps, v=eps-x0 회귀, tau ~ logit-normal(0,1), Euler 50 step 샘플링.
defaults:
  - dynpose_d200of5ec_noprobe_cos

exp_name: dynpose_d200of5ec_noprobe_rf
objective: rf
rf_t_sampling: logit_normal
