# @package _global_
# D217 — `dynpose_d200_molmo2_dec_l21_da3.yaml` 과 **한 줄만 다른** 사본: video CA 의 key/value 를
# 만들 때 decode feature 를 토큰축이 아니라 **채널축(프레임 정렬)**으로 붙인다.
#
# ═══ 왜 ═══════════════════════════════════════════════════════════════════════════════════
# 부모 arm 도 이미 visual + decode 를 둘 다 먹지만, 합치는 방식이 `cat([text_tok, video_tok],
# dim=1)` — 49 + 3136 = 3185 토큰을 **나란히 놓을 뿐**이다. 그러면 decode 슬롯 49개가 프레임과
# 1:1 정렬돼 있다는 사실(`--decode_keep points --fps 2.0` 이 존재하는 이유)이 통째로 버려진다.
# CA 가 "프레임 f 의 patch 와 프레임 f 의 트랙 점"을 짝지으려면 attention 으로 그 대응을 스스로
# 찾아야 하는데, 두 파트는 서로 다른 LN/proj/PE 를 지나 위치 인코딩조차 축이 다르다.
#
# 이 arm 은 대응을 **구조로 준다**: 프레임 f 의 decode feature (2560) 를 그 프레임의 visual
# patch 64개에 broadcast 해서 (3136, 5120) 한 덩어리로 만들고 projection **하나**로 넣는다.
# 토큰 수가 3185 → 3136 으로 줄고, 모든 토큰이 "이 patch 는 이 시점에 타깃이 화면 어디 있었나"를
# 함께 들고 있다.
#
# ═══ 캐시 ═════════════════════════════════════════════════════════════════════════════════
# molmo2 재굽기 0회. 기존 두 캐시를 그대로 조합한다 —
#   video/<scene>.pt  emb_l21 (3136, 2560) = 49프레임 x 8x8 patch
#   text.pt           emb_l21 (15219, 49, 2560) = 프레임 슬롯 49개
# 3136 = 49 * 64 라 reshape 만으로 정렬이 닫힌다 (모델이 assert 로 확인한다).
#
# ⚠ 두 파트는 스케일이 다르므로 concat **전에 각각** LayerNorm 한다 (FIX-D117). 트랙 점이 없는
#   프레임은 text 절반만 0 이고 visual 절반은 살아 있다. `aim=free` 변이는 49슬롯 전부 0 +
#   mask False 라 부모와 동일하게 visual-only 로 떨어진다.
defaults:
  - dynpose_d200_molmo2_dec_l21_da3

exp_name: dynpose_d200_molmo2_decfuse_l21_da3
video_text_fuse: frame_concat   # ← 부모와의 유일한 차이. 'token' 이 기존 동작.
