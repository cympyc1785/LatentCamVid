# @package _global_
# D135 — **D129 dynpose 코퍼스**(D128 축) 위의 da3 단독 arm.
#
# ═══ 왜 도나 ═════════════════════════════════════════════════════════════════════════════
# D129 뱅크(267편 / variant 46,425) 와 그 export(train 10,333 / test 1,176) 는 끝나 있는데
# 그걸 쓴 학습이 하나도 없었다. D128 에서 vista 축에 들어간 것들이 dynpose 축에는 아직 한 번도
# 학습 신호로 안 들어갔다:
#   · `--tau_ref follow`      track_* 의 τ 를 follow 궤적 기준 상대량으로 (D97)
#   · `track_min_drift_u`     추종 궤적이 사실상 정지인 조합 제거
#   · anchor 3/3             dynamic 3 + static 3 상한 (벽·바닥 target 금지)
#   · `drop_surfaces`        정적 anchor 에서 면(벽/바닥) 제외
#   · tracking lock 1.0      drift 0.6 -> lock (D126, 사용자 지시)
#   · `min_zcam`             카메라가 subject 뒤로 파고드는 조합 차단
#
# ═══ 대조군 ══════════════════════════════════════════════════════════════════════════════
# 같은 코퍼스·같은 holdout 27편 위의 `dynpose_d129_molmo2`(D136) 가 짝이다. 두 arm 의 실효
# diff 는 molmo2 CA 5줄 + 캐시 2줄뿐이고 나머지는 글자 그대로 같다.
# 판본 대조군은 `dynpose_d110_k6_dd10`(D110) 인데 **코퍼스가 다르다** — 아래 참조.
#
# ═══ D110 과 직접 비교 금지 ══════════════════════════════════════════════════════════════
#   train  10,333 entry / scene 240      test  1,176 entry / scene 27
#   D110 은 다른 뱅크(hole_bank_d110)에서 나왔고 holdout 씬 집합도 다르다. 게이트가 걸러낸
#   부분집합이 아니라 **다른 fit** 이므로 testset 지표를 코퍼스 간에 평균 비교하지 말 것.
#
# ═══ dd10 = dd 10% / preset 90% ══════════════════════════════════════════════════════════
# `seg_list_dynpose_dd10_*` 는 D110 때와 같은 규칙으로 잘렸다 (RNG 없음, 재현 가능):
#     python scripts/data/filter_seg_list_by_preset.py \
#         --root /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d129 \
#         --prefix seg_list_dynpose --target_frac_prefix dd_ --target_frac 0.10 --suffix dd10
# 실측: train 23,414 -> 10,333 (dd_* 1,033 = 10.0%), test 2,562 -> 1,176 (dd_* 118 = 10.0%).
#
# ═══ text_len 128 ════════════════════════════════════════════════════════════════════════
# D129 캡션은 D121 자연어 판본이다 (`caption_fields.motion` + `framing_nl` 조립한 concise 한
# 문장). D123 이후 vista arm 과 같은 128 을 쓴다 — conf/config.yaml:196 기본값 512 를 덮는다.
#
# ═══ geo raw 캐시 ════════════════════════════════════════════════════════════════════════
# 캐시 키가 scene 이름(`dynpose_<uuid>.pt`)이고 내용은 **소스 영상의 geo feature** 라 target
# 카메라 뱅크와 무관하다. 그래서 원리상 d84/d107/d110 arm 의 `latentcam_dynpose/geo_raw_cache_da3`
# 를 재사용할 수 있지만, 그쪽은 266 편뿐이라 d129 의 267 편 중 3편이 빈다
# (08dfacea… / 0b874565… / 10dd8bfe…, train 84 entry). 빠진 채로 돌리면 그 84 entry 만 조용히
# on-the-fly DA3-giant 로 떨어져 스텝 시간이 튄다. 그래서 **d129 루트 밑에 267편 전량**을 새로
# 구웠다 (11.34 GB, 0.19 s/scene, non-constant 0):
#     CUDA_VISIBLE_DEVICES=<g> EXP=dynpose_d129_da3 SPLITS=train,test \
#       python scripts/data/cache_geo_raw_da3.py
# 빌더의 `OUT` 기본값이 `<dl3dv_root>/geo_raw_cache_da3` 라 경로가 코퍼스 안으로 잡힌다.
exp_name: dynpose_d129_da3
dl3dv_root: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d129
meta_csv: meta_dynpose.csv
train_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d129/seg_list_dynpose_dd10_train.txt
test_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d129/seg_list_dynpose_dd10_test.txt
coverage_blacklist_path: null

text_len: 128   # D123 이후 vista arm 과 동일. 캡션이 D121 자연어 판본이라 잘림 없음.

pose_source: da3
target_pose_source: da3_target_poses   # target 만 <scene>/da3/target_poses.npz 로 교체
scale_mode: avg_scale
avg_scale_ref: context_first_cam       # 디렉토리 avg_scale_context_first_cam <- scene_graph S
intr_norm: rel                         # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                            # = 그 ckpt 의 latent_dim

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last

geo_view_sampling: context_uniform  # context range = 영상 전체 [0,49) = 소스 영상 전체
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true       # view0 = 프레임 s(=0). 이미 첫 픽이라 집합이 안 바뀐다.

geo_raw_cache_dir: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d129/geo_raw_cache_da3
da3_cam_token_per_sample: true   # 캐시는 B=1 로 구워진다 — 켜야 on-the-fly 폴백과 일치

anchor_pred_frame0: true

video_latent_dim: 0   # video CA 블록 자체를 만들지 않는다 (D117 이전과 비트 동일)

batch_size: 8
epochs: 100          # 실제 집행자는 conf/config.yaml 의 `epoch_cap: 100`.
ckpt_at_epochs: [50, 100]
