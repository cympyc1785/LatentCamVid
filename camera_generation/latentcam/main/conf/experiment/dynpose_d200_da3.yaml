# @package _global_
# D200 — d185(grid5) + d199(frame0 가시 anchor 회수) 를 **씬당 상한 6** 으로 합친 코퍼스 위의
# da3 geo arm. 이 세대의 5-arm 대조에서 molmo2 스트림이 없는 기준선이다.
#
# ═══ D197 과 뭐가 다른가 ═══════════════════════════════════════════════════════════════════
# 코퍼스 하나만 다르다. 모델축(스트림 구성·하이퍼)은 `dynpose_d197_da3.yaml` 에서 글자 그대로
# 가져왔다 — 그래야 두 세대 차이가 "씬 수 / 씬당 카메라 수" 로만 읽힌다.
#   d197  hole_bank_d185 단독, 씬당 상한 없음        8,362 씬
#   d200  hole_bank_d185 + hole_bank_d199, 상한 6   10,169 씬 / 51,422 대 (씬당 5.06)
# 거른 것: `--drop_status clamped_low` **하나뿐**이다 (사용자 지시 2026-09-17
# "free-moving도 포함해서 세주고 clamped_low만 빼줘"). D197 이 쓰던 suspect 5종 필터는 안 쓴다.
# 그래서 `aim=free` 변이가 26.79% (13,777/51,422) 그대로 들어온다 — molmo2 arm 들이 그 변이를
# zero-embedding 으로 받는 이유가 이것이다 (`dynpose_d200_molmo2_da3.yaml` 머리말).
# ═══ 분할 — train:test = 9:1, val 은 test 안의 1% (사용자 지시 2026-09-18) ══════════════════
# 기동 첫 판(폐기)은 holdout 이 100씬 / 506대 = **0.98%** 였다. 그건 "씬 수준 지표의 n 을
# 27 -> 100 으로" 가 목적이었지 비율이 목적이 아니었다. 지금은 비율이 요구사항이다:
#   train  46,278 대 (90.0%)   9,152 씬
#   test    5,144 대 (10.0%)   1,017 씬   ← 씬 단위 holdout, md5 해시 분할 아님
#     └ val   516 대 ( 1.0%)     102 씬   ← test 목록 **앞부분**
# 목록은 `scripts/make_holdout_split.py` 가 **씬당 카메라 수로 층화**해 뽑았다 (d200 분포가
# 1:726 / 2:472 / 3:143 / 4:179 / 5:3287 / 6:5362 로 양극단이라 무작위면 test 의 씬당 대수가
# train 과 달라진다). 실측 대/씬 train 5.057 vs test 5.058.
# legacy 27씬 ⊂ 100씬 ⊂ 1,017씬 을 강제했으므로 `test27` / `test100` 부분집합 지표로
# D137/D194/D197 과 계속 대조할 수 있다.
# validation 은 별도 목록 파일이 아니다 — `train_latent_cam_dm.py:737` 이 test 로더를
# `val_max_batches × batch_size` 만큼만 돌기 때문에, val 102씬을 test 목록 맨 앞에 씬
# 라운드로빈으로 깔고 **`val_max_batches: 64`** (×8 = 512대) 로 정확히 그 블록을 덮는다.
# 512대가 102씬을 전부 포함하는 것을 검증했다(라운드로빈이라 씬당 최소 1대).
# ⚠ `val_max_batches` 를 되돌리면 val 이 1% 가 아니게 된다. 두 값은 같이 움직인다.
# 재굽기는 없었다 — `vista4d_bank_to_dl3dv.py:493-519` 의 `--test_videos` 는 각 줄이 어느
# seg_list 로 가는지만 정하고 chunk/npz 와 geo_raw·molmo2 캐시는 씬 단위라 그대로 쓴다.
#
# ═══ CLaTr 게이지 ══════════════════════════════════════════════════════════════════════════
# 이 세대는 **d200 코퍼스로 직접 학습한 CLaTr** 로 캡션 지표를 잰다 (아래 clatr_* 두 줄).
# 기본값 `clatr_epoch139_large.ckpt` 는 E.T./ArtTraj 게이지(num_cams 120)라 49프레임 궤적에
# 71프레임 zero-pad 를 붙여 재던 것이다.
# **FD / PRDC / clatr_score 는 D194/D197 및 그 이전 어느 숫자와도 비교 불가**다 — 자가 바뀌었다.
# 같은 ckpt 를 쓴 run 끼리만 비교할 것 (`conf/config.yaml:651-657` 의 같은 경고).
#
# ═══ geo raw 캐시 ══════════════════════════════════════════════════════════════════════════
# 이 세대는 **굽고 쓴다** (사용자 지시 "da3 ... 캐싱"). context view 가 `context_uniform` 이라
# scene 상수이므로 같은 DA3 forward 를 씬당 5.06회 반복하던 것을 1회로 줄인다.
# 캐시가 없으면 조용히 on-the-fly 로 떨어지므로(D194/D197 이 그 상태로 완주했다) 굽기 전에
# 학습을 걸어도 결과는 같고 느릴 뿐이다.
exp_name: dynpose_d200_da3
dl3dv_root: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d200
meta_csv: meta_dynpose.csv
train_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d200/seg_list_dynpose_s91_train.txt
test_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d200/seg_list_dynpose_s91_test.txt
val_max_batches: 64   # ×batch_size 8 = 512대 = 코퍼스의 1%. 위 "분할" 절 참조 — 같이 움직인다
coverage_blacklist_path: null

# d200 **s91 train split 46,278개**로 학습한 CLaTr. 9:1 재분할 때 같이 다시 구웠다 —
# 예전 게이지(`clatr_dynpose_d200_epoch149.ckpt`, wandb bf7xk542)는 train 50,915 로 학습해서
# 새 test 5,144대 중 ~4,600대를 이미 본 상태였다. 게이지가 test 를 알면 caption 지표가 부풀고,
# 그게 조용히 일어난다.
# standardization 이름을 같이 넘겨야 padding 길이가 49 로 맞는다 — 빼면 config_eval.yaml 의
# 기본값 0120(num_cams 120)이 그대로 걸린다. 분할이 바뀌어도 `dynpose49_d200` 을 그대로 쓴다:
# `trajectory_dataset.py:43` 이 standardize=False 라 실제로 걸리는 건 num_cams 뿐이다.
# ⚠ 이 ckpt 가 아직 없으면 CLaTr eval 만 조용히 건너뛴다 (학습은 안 죽는다). 재분할 직후
# 몇 epoch 의 caption 지표가 비어 있는 것은 그 때문이다.
clatr_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/checkpoints/clatr_dynpose_d200_s91_epoch149.ckpt
clatr_standardization: dynpose49_d200

text_len: 128   # D197 과 동일.
# [new 2026-09-19] umt5 prefill 캐시. 스텝 계측에서 umt5 forward 가 42.5 ms (15.0%) 로
# denoiser forward 보다 컸다 — frozen 인코더 × 붙박이 캡션이라 매번 돌 이유가 없다.
text_emb_cache_path: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d200/umt5_cache/text_len128.pt

pose_source: da3
target_pose_source: da3_target_poses
scale_mode: avg_scale
avg_scale_ref: context_first_cam
intr_norm: rel
cam_dim: 64

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last
geo_view_sampling: context_uniform
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true
# [2026-09-19] fp32 -> bf16 재굽기(`convert_geo_raw_cache.py`). DataLoader 가 스텝의 62%였고
# 그 안은 디스크가 아니라 `raw` 텐서의 메모리 복사 2회(stack + 워커→메인 공유메모리)였다.
# fp32 원본은 `geo_raw_cache_da3` 에 그대로 있다 — 되돌리려면 이 줄만 되돌리면 된다.
geo_raw_cache_dir: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d200/geo_raw_cache_da3_bf16
geo_raw_cache_mmap: true         # 202 GB 캐시 — arm 마다 RAM 한 벌이면 4개에 806 GB (FIX 참조)
geo_raw_cache_dtype: bfloat16    # 없으면 loader 가 "낡은 bf16 캐시"로 보고 전량 무시한다 (FIX-D200)
da3_cam_token_per_sample: true   # 캐시는 B=1 로 구워진다 — 켜야 on-the-fly 폴백과 일치

anchor_pred_frame0: true

video_latent_dim: 0   # molmo2/PE-AV 스트림 없음

batch_size: 8
epochs: 100          # 실제 집행자는 conf/config.yaml 의 `epoch_cap: 100`.
ckpt_at_epochs: [50, 100]
