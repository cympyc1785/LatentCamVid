# @package _global_
# D163 — **D157 뱅크(굽는 중) 부분 export + dolly_in_look_at 단일 preset** 코퍼스 위의 da3 단독 arm.
# 3-arm 세트 { 이 파일 / dynpose_d157_dilo_molmo2 / dynpose_d157_dilo_da3_molmo2 } 의 첫 칸이다.
#
# ═══ 왜 dolly_in_look_at 하나만 남기나 (사용자 지시 2026-09-07) ══════════════════════════════
# "scene 늘려서 dolly in look at 만 학습했을 때 da3 vs molmo2 vs da3+molmo2 를 비교하고 싶다".
# preset 축을 없애면 남는 변이 축이 τ(hole 사다리)와 anchor(어느 물체를 향해 다가가나) 둘뿐이라,
# 세 모델 arm 의 차이가 "preset 어휘를 외웠나" 가 아니라 **"씬을 읽고 대상 쪽으로 들어가나"** 로
# 좁혀진다. 짝이 되는 이전 실험은 D95(`dynpose_d84_k6_dionly`) 하나뿐인데 그건 da3 단독이고
# preset 문자열도 `dolly_in`(D90 이전 이름) 이었다.
#
# ═══ 코퍼스 규모 — D95 대비 2.2배지 8배가 아니다 ═══════════════════════════════════════════
#   D95 (d84 dionly)    train  299 / test 37    scene 182 / 22
#   D163(d157 dilo)     train  645 / test 62    scene 149 / 17
# 뱅크 레벨의 `dolly_in_look_at` 변이는 2,644개지만 export 가 두 번 깎는다:
#   · 사다리 붕괴 중복  14301/26056 만 남는다 (같은 knob 으로 풀린 hole 사다리 단 병합, 39% 제거)
#   · `--drop_status clamped_low`  2659/26056 (10.20%) 제거 — 하한에서도 게이트 위반, 사실상 정지
# 결과가 `통과 707 / 14301`. **scene 수는 D95 보다 오히려 적다** (D157 이 875편 중 187편까지만
# 구워진 상태이고 그 187편은 d129 의 267편과 178편이 겹친다). 이번 arm 의 새로움은 scene 수가
# 아니라 preset 축을 없앤 것 + D149 앞단 + D151 τ 분모 S 다.
#
# ═══ 코퍼스 재현 ══════════════════════════════════════════════════════════════════════════
#     bash camera_generation/dataset/exec/_legacy/run_dynpose_d163_export.sh
#   (bank.json 글롭으로 그 시점 완료분만 캡션→export→`filter_seg_list_by_preset.py --presets
#    dolly_in_look_at --suffix dilo`. D157 이 다 구워지면 같은 명령을 다시 돌려 증분으로 붙인다.)
#
# ═══ 캐시 ═════════════════════════════════════════════════════════════════════════════════
# geo raw 는 **d129 루트의 것을 그대로 공유**한다 — 키가 scene 이름(`dynpose_<uuid>.pt`)이고
# 내용은 소스 영상의 geo feature 라 뱅크·preset 필터와 무관하다. dilo 가 덮는 166 scene 중
# 160편이 이미 있었고 나머지 6편만 새로 구웠다 (`cache_geo_raw_da3.py`, D163 에서 `meta['exp']`
# 를 동일성 비교에서 뺐다 — 안 그러면 라벨만 다른 파일 160개를 덮어쓰며 D160 학습이 읽는 중인
# 디렉토리를 흔든다).
exp_name: dynpose_d157_dilo_da3
dl3dv_root: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d157
meta_csv: meta_dynpose.csv
train_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d157/seg_list_dynpose_dilo_train.txt
test_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d157/seg_list_dynpose_dilo_test.txt
coverage_blacklist_path: null

text_len: 128   # D123 이후 전 arm 동일. 캡션이 D121 자연어 판본이라 잘림 없음.

pose_source: da3
target_pose_source: da3_target_poses   # target 만 <scene>/da3/target_poses.npz 로 교체
scale_mode: avg_scale
avg_scale_ref: context_first_cam       # 디렉토리 avg_scale_context_first_cam <- scene_graph S
intr_norm: rel                         # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                            # = 그 ckpt 의 latent_dim

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last

geo_view_sampling: context_uniform  # context range = 영상 전체 [0,49)
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true

# ↓ root 가 d157 인데 경로가 d129 인 것은 위 "캐시" 절 참조 (씬 단위라 공유 가능).
geo_raw_cache_dir: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d129/geo_raw_cache_da3
da3_cam_token_per_sample: true   # 캐시는 B=1 로 구워진다 — 켜야 on-the-fly 폴백과 일치

anchor_pred_frame0: true

video_latent_dim: 0   # video CA 블록 자체를 만들지 않는다 (D117 이전과 비트 동일)

batch_size: 8
epochs: 100          # 실제 집행자는 conf/config.yaml 의 `epoch_cap: 100`.
ckpt_at_epochs: [50, 100]
