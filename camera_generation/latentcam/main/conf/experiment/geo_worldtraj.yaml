# @package _global_
# Geo (LagerNVS) run on the WorldTraj scope (DL3DV 1K-7K, meta_worldtraj.csv):
#   context = first camera (frame s) FIXED + (k-1) views from the LONGER out-of-segment side
#     chosen by greedy coverage of the RESIDUAL space (frame s's own coverage subtracted first).
#   target normalization = avg_scale (cam_dist_mean = mean camera center-norm of the target segment).
#   LagerNVS encoder/decoder internally normalizes context by 1.35*max||center|| (geo_posed=True).
#   VAE + CLaTr = defaults (now vae_20260302_300.pth @ cam_dim 64 / intr_norm rel, and
#     clatr_epoch139_large.ckpt -- the CLaTr ckpt changed on 2026-07-30, so this run's FD/PRDC/
#     clatr_score are NOT comparable with the earlier epoch109 geo_worldtraj numbers).
#     With scale_mode cam_dist_mean this VAE measures latent std 0.99270, so the default
#     vae_latent_scale 0.96032625 gives a diffusion input std of ~1.034 -- near-unit here, unlike
#     the avg_scale text-only runs where the same constant lands at 0.4654.
exp_name: dl3dv_geo_worldtraj
meta_csv: meta_worldtraj.csv
coverage_blacklist_path: null
geo_encoder: lagernvs
geo_view_sampling: frustum_cover
geo_cover_out_of_seg: true
geo_first_view_target_s: true
geo_cover_subtract_first: true
geo_anchor_first_frame: true
geo_posed: true
scale_mode: cam_dist_mean
# Read the precomputed frozen geo latents instead of running LagerNVS every step. The cache under
# first_cam_included/ was built by cache_geo_embeddings.py from THIS experiment's context
# selection, and cache-ON vs cache-OFF geo_emb was verified bit-exact (maxdiff 0.000000), so this
# is a pure speed change. Measured on the full corpus (39830 samples, bs8, 1 GPU):
#   cache ON 4.16-4.22 it/s (~17.8 min/epoch)  vs  OFF 2.85 s/it = 0.351 it/s (~3h33m/epoch) = ~12x.
#   (A smoke-scale max_scenes=40 comparison showed no difference -- 1.82 vs 1.87 it/s -- because
#    40 scenes' context images all fit in the page cache; ignore that measurement.)
# Any segment missing from the cache falls back to the on-the-fly path.
# Set to null to force the original per-step LagerNVS forward.
geo_latent_cache_dir: /data1/cympyc1785/data/DL3DV/latent_cache