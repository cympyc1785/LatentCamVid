# @package _global_
# D201-C — `dynpose_d200_molmo2_l21_da3.yaml` 에 **subject OBB 궤적 concat 조건**을 dropout 0.5
# 로 얹은 사본. 모델 코드는 한 줄도 안 바뀐다 — D195-B(`dynpose_d194_molmo2_l21_track_d5`) /
# D196 이 쓰던 경로를 d200 코퍼스 위에서 그대로 켠다.
#
# ═══ 왜 지금 이 arm 인가 ═════════════════════════════════════════════════════════════════
# 앞선 두 세대(D195 = d194 코퍼스, D196 = 캡션 복원판)에서는 subject 조건을 **한 쌍**으로
# 돌렸다: readout+aux("맞히게 한다") 와 track_d5("그냥 준다"). d200 세대는 D201-B 로 readout
# 쪽만 기동했고 track 쪽 짝이 비어 있다. 짝이 없으면 D201-B 의 결과가 "subject 정보가 도움이
# 되는가"인지 "readout 이라는 배선이 도움이 되는가"인지 못 가른다 — 이 arm 이 그 분모다.
#
# ═══ 무엇이 바뀌나 ═══════════════════════════════════════════════════════════════════════
# D201-B(readout+aux) 는 subject 위치를 **맞히게** 한다. 이 arm 은 반대로 subject 위치를
# **그냥 준다** — x_t 채널에 (x,y,z,valid) 4채널을 붙인다. 대신 절반(dropout 0.5)을 null 로
# 봐서 track 없는 경로도 같이 학습하고, **추론은 track 없이** 돌린다. 즉 궤적 조건은 학습 때만
# 쓰는 보조 정보이고, 평가 눈금은 l21 대조군(③)과 같다.
# 그래서 `target_track_val_drop: true` 가 필수다 — val 을 실제 track 으로 돌리면 곡선이
# "track 있을 때"만 보여 주고, 정작 우리가 쓸 조건(track 없음)의 성능이 학습 중에 안 보인다.
#
# ═══ dropout 0.5 의 뜻 ═══════════════════════════════════════════════════════════════════
# per-sample. null 은 "채널을 뺀다"가 아니라 **전 채널 0** 이다 (valid 채널 포함) — concat 조건은
# uncond forward 에도 채널 수가 있어야 하므로 CFG 를 '빼기'가 아니라 null 값으로 정의한다
# (train_latent_cam_dm.build_track_cond). 추론에서 cond=None 이면 모델이 같은 0 을 채운다.
#
# ═══ 게이지 ══════════════════════════════════════════════════════════════════════════════
# 조건은 world 좌표가 아니라 cam_param 과 **같은 자**로 들어간다: frame-s 카메라 좌표계로 옮긴 뒤
# norm_scale(avg_scale_context_first_cam) 로 나눈 값. 분모까지 같아야 모델이 카메라 t 와 subject
# 위치를 한 눈금으로 읽는다.
#
# ═══ 데이터 전제 ═════════════════════════════════════════════════════════════════════════
# `<scene>/da3/target_track.npz` 필요. D201-B 를 위해 2026-09-19 에 d200 코퍼스 전량 생성했고
# (scenes 10169 / variants 51422 / valid 100%), 실측 재확인 10,169/10,169 씬에 파일이 있다.
# 없으면 dataset 이 터진다 (조용히 zero 조건으로 학습되면 이 arm 이 ③ 과 같아져 버리므로
# 의도된 동작이다).
#
# ═══ 다시 안 굽는 것 ════════════════════════════════════════════════════════════════════
# 캡션·pose·seg list·모델 입력 토큰이 한 글자도 안 바뀌므로 `prompts.json` /
# `umt5_cache/text_len128.pt` / `molmo2_cache/*` / `geo_raw_cache_da3_bf16` / `.latentcam_index`
# 전부 d200 것을 그대로 쓴다. track 은 인덱스가 아니라 npz 에서 항목마다 읽는다.
defaults:
  - dynpose_d200_molmo2_l21_da3

exp_name: dynpose_d201_molmo2_l21_track_d5

target_track_dim: 4          # [x,y,z,valid] -> cam_in 입력이 cam_dim+4
target_track_dropout: 0.5    # ★ per-sample null. 추론에서 track 없이 쓰려고 남기는 경로
target_track_val_drop: true  # ★ val = cond None. 눈금을 ③ l21 대조군과 맞춘다
