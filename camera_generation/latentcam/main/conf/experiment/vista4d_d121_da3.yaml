# @package _global_
# D121 arm 1 — **da3 geo encoder 만** (video CA 없음). `vista4d_pgt_k6_d77.yaml` 을 그대로 복사하고
# 데이터 경로 3줄 + exp_name 만 바꿨다. 학습 하이퍼는 한 글자도 안 건드렸다.
#
# ═══ d77 뱅크 대비 무엇이 다른가 ══════════════════════════════════════════════════════════
# 씬 52편도 test holdout 4편(avocado-slice, bmx-bumps, camel, couple-hug)도 **d77 과 같다**.
# 바뀐 것은 캡션과 그 캡션을 만든 fit 세팅뿐이다:
#   1) **캡션 전면 재설계** (D121). free-moving 은 "The camera [motion]", object-centric 은
#      "The camera [motion] around/toward [target] while keeping [framing]" 골격이고,
#      target 은 "camel" 이 아니라 "the larger pale camel walking along the fence" 처럼
#      VLM instance description 을 달았다. framing 은 shot scale 전이 + composition
#      (같이 담기는/빠지는 물체)을 포함한다. motion 에는 정도 부사가 다시 들어갔다.
#   2) hole 사다리 4단(0.10/0.20/0.35/0.50) + area_timeline + composition 열.
#   3) 변이 29,964 -> dedup 후 세그먼트 train 14,975 / test 875 (d77 은 13,016 / 689).
#
# ═══ arm 2 와의 관계 ══════════════════════════════════════════════════════════════════════
# `vista4d_d121_peav.yaml` 이 짝이다. 그쪽은 text CA 를 umt5 -> PE-AV text tower 로 갈고
# video CA(PE-AV 프레임 토큰)를 하나 더 얹는다. **이 파일은 그 대조군**이라 데이터·하이퍼가
# 전부 같아야 한다 — 여기서 뭘 바꾸면 두 arm 의 차이가 인코더 차이로 안 남는다.
#
# geo_raw_cache 는 d77/k6 arm 과 **공유**한다. context 는 소스 영상이라 뱅크와 무관한 scene
# 상수이고, d121 의 52편이 캐시 52 파일과 이름까지 일치한다 (실측 comm 차집합 0).
exp_name: vista4d_d121_da3
dl3dv_root: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121
meta_csv: meta_vista4d.csv
train_seg_list: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121/seg_list_vista4d_train.txt
test_seg_list: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3_k6_d121/seg_list_vista4d_test.txt
coverage_blacklist_path: null

pose_source: da3
target_pose_source: da3_target_poses   # target 만 <scene>/da3/target_poses.npz 로 교체
scale_mode: avg_scale
avg_scale_ref: context_first_cam       # 디렉토리 avg_scale_context_first_cam <- scene_graph S
intr_norm: rel                         # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                            # = 그 ckpt 의 latent_dim

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last

geo_view_sampling: context_uniform  # context range = 영상 전체 [0,49) = 소스 영상 전체
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true       # view0 = 프레임 s(=0). 이미 첫 픽이라 집합이 안 바뀐다.

geo_raw_cache_dir: /data1/cympyc1785/data/Vista4D-Eval-Data/latentcam_da3/geo_raw_cache_da3
da3_cam_token_per_sample: true   # 캐시는 B=1 로 구워진다 — 켜야 on-the-fly 폴백과 일치

anchor_pred_frame0: true

video_latent_dim: 0   # video CA 블록 자체를 만들지 않는다 (D117 이전과 비트 동일)

batch_size: 8
epochs: 200
ckpt_at_epochs: [50, 100]
