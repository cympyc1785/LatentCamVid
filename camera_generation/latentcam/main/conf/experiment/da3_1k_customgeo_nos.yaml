# @package _global_
# custom geo encoder (models/custom_geo_encoder.py) arm B — **geo_worldtraj_camembed 형**
# context 선택. da3_1k_customgeo_withs.yaml 과 **두 줄만** 다르다:
#   geo_first_view_target_s: false    (withs 는 true)
#   geo_cover_subtract_first: false   (withs 는 true)
# 즉 target segment 카메라가 context 에 하나도 안 들어간다 — geo_cover_out_of_seg: true 가
# 후보를 before(0..s) / after(e..N) 중 긴 쪽으로 제한하고, 여기서는 frame s 를 미리 꽂지도
# 빼놓지도 않고 6장 전부를 greedy coverage 로 뽑는다. 커버리지 볼은 여전히 frame s 를 중심으로
# 하지만(geo_cover_centered_at_s: true) 그건 추론 시점에 아는 값이라 누수가 아니다.
#
# 원본 camembed arm 은 잃어버린 프레임 정합을 geo_cam_embed='relfirst' (view 당 11-d 상대 pose)
# 로 보상했다. 여기서는 **geo_cam_embed: null** 이다 (사용자 결정 2026-08-07 "context 선택만").
# custom 인코더가 이미 픽셀당 Plücker ray 를 target 첫 카메라 기준으로 받고 있어서, context view
# 가 target 프레임 어디에 있는지는 그 ray 들 자체에 들어 있다 — relfirst 는 같은 정보의 중복이다.
# 그래서 withs arm 과의 차이는 순수하게 "생성할 첫 카메라를 context 로 보여 주느냐"뿐이다.
#
# 나머지는 da3_1k_customgeo_withs.yaml 의 주석 참고 (인코더 구조 / dataset 이 내보내는 텐서 /
# pose_source: da3 강제 이유 / vae_latent_scale 을 config 기본값으로 두는 이유).
exp_name: da3_1k_customgeo_nos
pose_source: da3
batch_size: 8
epochs: 150

geo_encoder: custom
geo_cam_embed: null           # 카메라는 픽셀 Plücker 로만 들어간다
geo_latent_cache_dir: null    # GeoTokenizer/proj 가 학습되므로 출력을 얼릴 수 없다
geo_posed: false              # custom backend 는 lagernvs cam_token 을 만들지 않는다
custom_geo_input_hw: [252, 448]   # 14 의 배수 (256 -> 252). dataset/encoder 가 어긋나지 않게 명시
custom_geo_freeze_dino: true

geo_view_sampling: frustum_cover
geo_cover_out_of_seg: true
geo_cover_centered_at_s: true
geo_first_view_target_s: false    # <- arm B 의 정의. withs arm 은 true
geo_cover_subtract_first: false   # <- arm B 의 정의. withs arm 은 true

scale_mode: avg_scale
intr_norm: rel                # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                   # = 그 ckpt 의 latent_dim
meta_csv: meta_da3_1k.csv
train_seg_list: /data1/cympyc1785/data/DL3DV/scenes/latentcam_da3_1k_train_seg_list.txt
test_seg_list: /data1/cympyc1785/data/DL3DV/scenes/latentcam_da3_1k_test_seg_list.txt
# da3_1k_{textonly,da3pose} 와 **같은** teleport 세그먼트 blacklist (합집합).
coverage_blacklist_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/data/seg_blacklist_jump_da3_1k.csv
