# @package _global_
# da3_7k_da3geo_asfirstcam.yaml 에서 `avg_scale_ref` 를 바꾼 arm
# (context_first_cam -> front_first_anchor).
# !! 2026-08-16 부터 geo 도 같이 앞쪽으로 제한한다 (`geo_cover_before_only: true`, 아래 참조).
#    그 전 버전(geo 는 양쪽 중 긴 쪽)의 100 epoch 결과는 eval_my/common100ep 에 남아 있다.
#
# 무엇이 바뀌나 — **target cam_param 의 분모 하나뿐이다.**
#   점 집합 규약은 세 변형이 전부 같다 (da3 depth unproject, conf >= 전역 P40, pixel_stride 2,
#   기준점까지의 거리 mean). 다른 건 **context range** 와 **기준점**:
#     centroid           range [0,s)/[e,N) 중 긴 쪽   기준점 context 카메라 중심들의 centroid
#     context_first_cam  range 같음                    기준점 그 range 의 첫 카메라
#     front_first_anchor range **[0, s)** (앞쪽만)      기준점 **target segment 첫 카메라 s**
#
# 왜 앞쪽만인가: 앞 두 변형은 context range 가 target 오른쪽([e,N))에 잡힐 수 있는데, 그때
# frame s 를 기준으로 거리를 재면 "아직 안 지나간 뒤쪽 공간까지의 거리"가 되어 분모의 의미가
# 흐려진다. 앞쪽으로 고정하면 s 가 range 바로 뒤에 붙어 기준점과 점 집합이 공간적으로 이어진다.
#
# 왜 anchor 가 frame s 인가: cam_param 은 `E @ inv(E_s)` 로 **frame s 기준** 재고정된 뒤 이 분모로
# 나뉜다 (utils/data_utils.normalize_camera_extrinsics_and_points). 앞 두 변형은 분모의 기준점이
# context 쪽에 있어 "재고정 기준"과 "스케일 기준"이 어긋나 있었다. 여기서 둘을 일치시킨다.
# s 의 포즈는 추론 시에도 주어지므로(first_extrinsic) leakage 가 아니고, 점은 여전히 target
# 프레임 [s,e) 를 전혀 안 쓴다.
#
# 학습 샘플이 줄어든다: s == 0 인 세그먼트는 앞쪽 context 가 비어 있어 파일이 없고
# dataset 이 인덱스에서 뺀다 (dataset_cfg.avg_scale_min_front). da3_7k 는 전 세그먼트 길이 49 /
# s in {0,49,98,...} 이라 s<49 <=> s==0 이고, 따라서 da3_7k_da3geo_frontanchor_samelen 과
# **정확히 같은 집합**을 뺀다 -> 두 arm 은 paired 비교가 된다 (300 scene 표본에서 확인).
#
# geo 쪽은 **전혀 영향을 받지 않는다.** geo_encoder='da3' 는 cam_token 을 DA3 자체 규약
# (view0 기준 재고정 + per-sample median camera distance) 으로 만들고 norm_scale 을 안 쓰며,
# geo_cam_embed 도 null 이라 avg_scale 이 들어가는 경로가 없다. Plücker/log-depth 도 안 만든다.
# !! 그래서 이 arm 은 target 쪽 앵커만 s 로 맞춘 것이고 geo 쪽 앵커(view0)와의 갭은 남아 있다.
#
# !! vae_latent_scale 은 0.96032625 를 그대로 둔다. 분모가 바뀌면 VAE latent 의 실제 std 도
#    바뀌므로 이 상수는 이 arm 에 맞춰 측정한 값이 아니다. 유지하는 이유는 다른 arm 들과
#    loss_traj / loss_latent 를 같은 축에서 비교하기 위해서다.
# [2026-08-13 앵커 정합] geo_first_view_target_s: true
#   DA3 는 cam_token 을 view0 기준으로 재고정한다 (build_cam_token: w2c @ c2w[:, :1] — DA3 원본
#   api.py:439-440 _normalize_extrinsics 와 같은 식). target 은 rel = E @ inv(E_s) 로 프레임 s
#   기준이다. view0 != s 면 두 트랙의 R,t 앵커가 다른 카메라라 강체변환만큼 어긋난 채 학습된다.
#   -> view0 = 프레임 s 로 둔다. s 는 geo_num_views(=geo_cover_k) **안에** 든다 (나머지 k-1 장만
#   retrieval/uniform) — 토큰 예산 V*P 를 다른 arm 과 같게 유지.
exp_name: da3_7k_da3geo_frontanchor
pose_source: da3
avg_scale_ref: front_first_anchor
batch_size: 8
epochs: 100
ckpt_at_epochs: [50]

geo_encoder: da3
geo_cam_embed: null           # 카메라는 DA3 cam_enc 토큰으로만 들어간다
geo_latent_cache_dir: null    # LayerNorm/proj 가 학습되므로 출력을 얼릴 수 없다
geo_posed: true               # DA3 cam_enc 에 GT pose 주입 (DA3 규약으로 정규화)
geo_shuffle_order: false      # DA3 는 view0 를 reference 로 쓴다 -> 셔플 금지 (dataset 이 raise)
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]  # 14 의 배수. dataset/encoder 가 어긋나지 않게 명시
da3_geo_layers: last

# [2026-08-16 정합] geo_cover_before_only: true  <- 이 arm 의 유일한 변경점
#   그 전까지 이 arm 은 **분모만** 앞쪽([0,s))으로 제한하고 geo context view 는 asfirstcam 과 같게
#   양쪽 중 긴 쪽에서 뽑았다 (분모 단독 효과를 재려고 geo 를 고정한 것). 그 결과 학습 샘플의
#   **43.4%** (train 12781/29414, val 1415/3263) 에서 context 가 target 뒤쪽 [e,N) 에 잡혀
#   **분모를 만든 공간을 모델이 아예 못 보는** 상태가 됐다 -> 그 샘플의 분모는 context 만으로
#   복원 불가능한 잡음이다. (대조: context_first_cam 은 분모 range == context range 라 항상
#   복원 가능하지만 앵커가 프레임 e 로 옮겨간다. 둘 다 결함이 하나씩 있었다.)
#   게다가 실제 배치는 source video 가 연속으로 앞에 오는 causal 상황이라 뒤쪽 context 자체가
#   test 분포에 없다 -> train/test 분포 불일치.
#   뒤쪽을 섞어 얻는 이득의 증거도 없다: 공통 testset 3263 세그먼트 paired 비교에서
#   frustum_cover(43% 뒤쪽) - front_uniform(100% 앞쪽) clatr_score = -0.0894
#   (d_z -0.006, 세그먼트 win-rate 0.499) — 9 arm 대비 중 가장 작은 갭이다.
#   -> 분모와 context 를 둘 다 [0,s) 로 맞춘다.
#   **인덱스는 안 바뀐다**: before_only 필터는 s < geo_cover_k(=6) 만 거르는데
#   (dataset_dl3dv.py:468,572) 세그먼트가 s in {0,49,98,...} 이고 front_first_anchor 가 이미
#   s==0 을 뺐으므로 추가로 빠지는 게 없다 (29414/3263 유지 -> 이전 arm 과 계속 paired).
#   앞쪽 pool 길이(= s) 분포 p05 49 / p25 98 / p50 147 / p75 245 / p95 294 로 최악도 49프레임
#   = samelen 이 쓰는 window 와 같아 후보가 고갈되지 않는다. samelen 과 달리 window 를 49 로
#   고정하지 않으므로 **넓은 context range 도 학습에 들어간다** (samelen 은 그 첫 세그먼트에 해당).
#   !! 캐시 키에 bo{0,1} 이 들어가므로 (dataset_dl3dv.py:403) 인덱스가 새로 빌드된다.
geo_view_sampling: frustum_cover
geo_cover_out_of_seg: true
geo_cover_before_only: true   # <- context 도 [0,s) 앞쪽만 (분모와 정합 + causal)
geo_cover_centered_at_s: true
geo_first_view_target_s: true
geo_cover_subtract_first: false

scale_mode: avg_scale
intr_norm: rel                # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                   # = 그 ckpt 의 latent_dim
meta_csv: meta_da3_7k.csv
train_seg_list: /data1/cympyc1785/data/DL3DV/scenes/latentcam_da3_7k_train_seg_list.txt
test_seg_list: /data1/cympyc1785/data/DL3DV/scenes/latentcam_da3_7k_test_seg_list.txt
coverage_blacklist_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/data/seg_blacklist_jump_da3_7k.csv
