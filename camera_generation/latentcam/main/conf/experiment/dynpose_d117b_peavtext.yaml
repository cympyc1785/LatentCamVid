# @package _global_
# D117-b (arm B, full PE-AV) — arm A(dynpose_d117a_peavvid) 와 **PE-AV text 토큰이 어느 CA 로
# 들어가는지 한 축만** 다르다. 여기서는 umt5-xxl 을 아예 안 띄우고
#   text CA (PE-AV text tower, 1024-d, NL 캡션)  ->  video CA (PE-AV 프레임 토큰 49개)
#     ->  geo CA (DA3)
# 순서다. arm A 는 text CA 가 umt5(4096, struct 캡션)이고 PE-AV text 는 video CA 앞에 붙는다.
#
# ═══ 왜 이 arm 을 같이 돌리나 (사용자 지시: "두 arm 다 돌리기") ═══════════════════════════
# PE-AV text 타워는 video 타워와 대조학습으로 정렬돼 있어 "어느 물체가 target 인지"를 이미 안다.
# 그게 umt5 를 **대체**할 만큼 충분한지가 이 arm 의 질문이다. 리스크는 명확하다 —
# ModernBERT 22층 hidden 은 1024-d 에 최대 26 토큰(우리 캡션 실측)뿐이라 motion 절의 세부
# (`with an ease-in`, `without re-aiming`)를 umt5 만큼 실어나르지 못할 수 있다. 반대로
# 이득은 target 매칭이 인코더 안에서 이미 풀려 있다는 것.
#
# ═══ 캡션 형식 ════════════════════════════════════════════════════════════════════════════
# PE-AV 쪽 캡션은 struct(`target: X. motion: Y.`)가 아니라 **자연어**다 — 같은 프로브에서
# struct 는 4형식 중 꼴찌(test top1 0.410)였고 NL 이 1등(0.686)이었다. 문장은
# cache_peav_embeddings.py:nl_caption 이 caption_fields 에서 규칙으로 조립한다:
#   "The camera dollies back along its own axis without re-aiming with the dog in frame."
# 즉 이 arm 은 text CA 의 **인코더와 캡션 형식이 동시에** 바뀐다. 두 축을 가르려면 arm A 와
# 비교하면 된다 (arm A 는 같은 NL 문장을 video CA 쪽에 넣고 umt5 struct 를 남긴다).
#
# ═══ d107_k6 config 대비 실효 diff ════════════════════════════════════════════════════════
# exp_name + text_encoder + PE-AV 4줄. 나머지는 한 글자도 안 바뀐다.
# text_len/t5_* 는 text_encoder=PEAV 에서 아예 안 읽힌다 (T5EncoderModel 을 안 만든다).
exp_name: dynpose_d117b_peavtext
dl3dv_root: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d107
meta_csv: meta_dynpose.csv
train_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d107/seg_list_dynpose_train.txt
test_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d107/seg_list_dynpose_test.txt
coverage_blacklist_path: null

pose_source: da3
target_pose_source: da3_target_poses   # target 만 <scene>/da3/target_poses.npz 로 교체
scale_mode: avg_scale
avg_scale_ref: context_first_cam       # 디렉토리 avg_scale_context_first_cam <- scene_graph S
intr_norm: rel                         # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                            # = 그 ckpt 의 latent_dim

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last

geo_view_sampling: context_uniform  # context range = 영상 전체 [0,49) = 소스 영상 전체
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true       # view0 = 프레임 s(=0). 이미 첫 픽이라 집합이 안 바뀐다.

geo_raw_cache_dir: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose/geo_raw_cache_da3
da3_cam_token_per_sample: true      # 캐시가 B=1 로 구워지므로 켜야 폴백 경로와 일치한다

anchor_pred_frame0: true

# ═══ PE-AV: text CA + video CA 둘 다 ══════════════════════════════════════════════════════
text_encoder: PEAV                  # umt5 미사용. text CA 입력 = peav_text (1024-d)
peav_video_cache_dir: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d107/peav_cache/video
peav_text_cache: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d107/peav_cache/text_nl.pt
video_latent_dim: 1792              # pe-av-large visual tower per-frame 토큰
video_text_in_stream: false         # text 는 이미 text CA 로 갔다. video CA 는 프레임 토큰만.

batch_size: 8
epochs: 200
ckpt_at_epochs: [50, 100]
