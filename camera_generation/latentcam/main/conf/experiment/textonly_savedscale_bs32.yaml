# @package _global_
# textonly_savedscale @ batch_size 32 — the batch-size arm of the bs8-vs-bs32 comparison.
# IDENTICAL to textonly_savedscale_bs8.yaml except exp_name + batch_size, so the two runs isolate
# batch size and nothing else. Kept flat (not a Hydra `defaults:` include) to match how
# vae_dl3dv_smoke.yaml relates to vae_dl3dv.yaml.
#
# text-only with SCVideo's ORIGINAL DL3DV-only normalization: camera translations divided by the
# stored point-cloud avg_scale (scale_mode=avg_scale) + SCVideo's non-relative intrinsics
# (intr_norm=raw, i.e. fx/2cx, fy/2cy) — the exact pipeline vae_20260202_065659_400 was fit with
# (SCVideo main/config.py + data/dataset.py, DL3DV 1K only). The VAE triple
# (vae_20260202_065659_400 / cam_dim 32 / vae_latent_scale 0.4467666) comes from config.yaml.
# intr_norm is pinned rather than left at the default so the ckpt<->convention pairing survives
# future default changes (legacy 'auto' would pick the WRONG 'rel' for scale_mode=avg_scale:
# intr recon L1 0.263 vs 0.0029).
#
# 32 is config_large.py's batch size (SCVideo's own config.py used 64); all our previous
# text-only runs used 8, which is the other arm.
exp_name: dl3dv_textonly_savedscale_bs32
batch_size: 32
geo_encoder: null
scale_mode: avg_scale
intr_norm: raw
# Corpus = meta_worldtraj.csv (DL3DV 1K-7K), the same scene list every other worldtraj-scoped run
# uses. coverage_blacklist_path stays null (it scores geo context coverage — meaningless without a
# geo encoder). The scene-level blacklist.csv needs no flag: meta_worldtraj.csv already excludes
# all 295 of its scenes and dataset_dl3dv re-applies it unconditionally at index build.
meta_csv: meta_worldtraj.csv
