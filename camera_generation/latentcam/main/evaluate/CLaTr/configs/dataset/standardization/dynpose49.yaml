# dynpose d137 코퍼스(49프레임) 용 standardization. vista49.yaml 과 같은 이유로 만든다 —
# 0120.yaml 은 E.T./ArtTraj 게이지(num_cams 120)라 우리 49프레임 궤적에 맞지 않는다.
#
# num_cams 는 padding 길이다 (trajectory_dataset.py:180). dynpose 궤적도 전부 정확히
# 49프레임이라 padding 이 0 이 된다.
#
# norm_*/shift_* 는 `prepare_clatr_vista.py --print_stats` 로 **dynpose d137 train split
# 9728개**에서 실측했다 (velocity 표기: 첫 프레임 = 절대 위치, 이후 = 프레임 차분).
# shift_* 가 0 인 것은 오류가 아니다 — dynpose target 궤적은 frame0 이 world 원점에
# 앵커되어 있어서 첫 프레임 위치가 항상 0 이다. vista d121 은 그렇지 않아
# shift_std 가 [0.389, 0.082, 0.226] 이었다. 실측 shift_std 는 [3e-8, 1e-8, 2e-8] 인데
# 그대로 적으면 standardize 를 켜는 순간 0 나눗셈이 되므로 **1.0 으로 둔다** (shift 가
# 항등이라 나눌 게 없다는 뜻).
#
# 주의 — `trajectory_dataset.py:43` 이 `self.standardize = False` 로 못 박아 두어 이
# 통계는 학습에 쓰이지 않는다. 그래도 남의 코퍼스 숫자를 물려두면 나중에 standardize 를
# 켜는 순간 조용히 틀리므로 우리 값을 적어 둔다.

name: 'dynpose49'
num_interframes: 0
num_cams: 49
num_total_frames: ${eval:'${dataset.standardization.num_interframes} * (${dataset.standardization.num_cams} - 1) + ${dataset.standardization.num_cams} '}

norm_mean: [0.00176571, 0.00005792, -0.02920337]
norm_std: [0.07040992, 0.01523429, 0.08732070]

shift_mean: [0.0, 0.0, 0.0]
shift_std: [1.0, 1.0, 1.0]

velocity: true
