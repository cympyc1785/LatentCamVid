# @package _global_
# D197-d — `dynpose_d197_molmo2_da3.yaml` 과 **텍스트 캐시 한 줄만** 다른 사본:
# molmo2 hidden 을 prompt 위치(prefill)가 아니라 **greedy decode 스텝**에서 가져온다.
#
# ═══ 왜 (사용자 지시 2026-09-16) ══════════════════════════════════════════════════════════
# 기존 arm ②/③ 이 먹는 것은 캡션+probe 가 놓인 **prompt 위치**의 hidden 이다 — 모델이 답을
# 아직 한 토큰도 커밋하지 않은 상태의 표현이다. 이 arm 은 그 prefill hidden 을 전부 버리고,
# 모델이 실제로 생성하는 동안 나오는 hidden 만 쓴다.
#
# ⚠ 실측: 우리 문장이 `Track {target}.` 이라 Molmo2 는 이걸 **자기 native tracking 과제**로
#   받아 카메라 서술이 아니라 2D 물체 트랙 XML 을 낸다 —
#     `<tracks coords="0.0 1 444 461;0.5 1 444 453; ... ;23.5 1 295 494">the man in a light
#      grey shirt and cap standing by the grill</tracks>`
#   즉 이 arm 의 decode hidden 은 "카메라 궤적 서술"이 아니라 **타깃의 시간축 화면 좌표 읽기**를
#   하는 동안의 표현이다. 텍스트를 arm ②/③ 과 글자 단위로 같게 유지해야 prefill↔decode 만
#   갈리므로 문장은 안 바꾼다.
#
# ═══ 슬롯 = 프레임 (D197-d2, 사용자 지시 "49프레임 다 나오도록") ═══════════════════════════
# 위 XML 은 점마다 **시각**을 달고 나온다. 그래서 점 하나가 끝나는 토큰(`;`, 마지막 점은
# coords 를 닫는 `"`)의 hidden 만 골라 `round(t*fps)` 프레임 슬롯에 담는다 — 슬롯이 곧
# 프레임이라 video 토큰의 49x8x8 격자와 축이 맞고, 저장량도 49슬롯이라 전 토큰(~800)의 1/16.
# 점 개수는 **fps 가 정한다**: 모델은 0.5 s 라벨마다 한 점을 찍는데 `--fps` 는 프레임별 시각
# 문구만 바꾼다. 기본 25.0 이면 49프레임이 0.0~1.9 로 뭉쳐 라벨 20종 / 점 4개뿐이고,
# **2.0** 이면 라벨이 0.0,0.5,...,24.0 이라 프레임과 1:1 (실측 3씬 점 48/49/49, 721~733 tok
# 자연 종료). 캐시는 `--fps 2.0 --decode_tokens 900 --decode_keep points --decode_points 49`.
# mask 는 점이 실제로 찍힌 프레임만 True (실측 채운 슬롯 48.7/49, 파싱 실패 0%).
#
# ═══ 캐시 ════════════════════════════════════════════════════════════════════════════════
# video 캐시는 **소스 영상만** 보므로 arm ②/③ 과 같은 파일을 그대로 읽는다 (재굽기 없음).
# fps 를 바꾸면 prefix 토큰열 길이가 4323 -> 4341 로 달라지지만 video 는 일부러 안 다시 굽는다 —
# 바꾸는 건 text 스트림 하나여야 arm 사이에서 video 가 비트 동일하게 남는다.
# text 캐시만 `text_decode_pts49.pt` 로 따로 굽는다 — `--extra_layer 21` 이라 마지막 층과 21층을
# 같은 파일에 들고 있고, 21층 arm 은 이 파일을 상속해 한 줄만 바꾼다.
defaults:
  - dynpose_d197_molmo2_da3

exp_name: dynpose_d197_molmo2_dec_da3
peav_text_cache: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d197/molmo2_cache/text_decode_pts49.pt
peav_layer: null           # null = 마지막 층(ln_f 이후). 21 로 바꾸면 blocks[21] raw 출력.
