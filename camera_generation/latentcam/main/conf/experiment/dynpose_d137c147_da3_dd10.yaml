# @package _global_
# D160 — **fitting 이 끝난 최신 dynpose 코퍼스 + 최신 캡션** 위의 da3 단독 arm, DataDoP 10%.
# 짝은 `dynpose_d137c147_da3_nodd`(DataDoP 0%). 둘의 diff 는 seg_list 두 줄뿐이다.
#
# ═══ 왜 d137c147 인가 (코퍼스 선택 근거) ═════════════════════════════════════════════════
# 사용자 지시(2026-09-07): "fitting 끝난 최신 dynpose 기준 caption 만 최신 형태로 바꾼 걸로
# dd10 와 nodd da3 로 학습". D157(875편 재굽기)은 아직 fit 중이므로(3 샤드 12~13 h) 제외.
# fit 이 끝난 dynpose 코퍼스 5종 중 캡션이 최신인 것은 하나다:
#     d107      "target: dog. motion: the camera dollies back ..."   <- D121 이전 구조형. 기각
#     d122/d129/d137                                                  <- D121 자연어
#     d137c147  = d137 뱅크 + D147 캡션 재굽기                          <- **채택**
# d137c147 은 D147 이 `--framing_min_in_frame 0.85` 게이트를 dynpose 에 적용해 캡션만 다시
# 구운 것이다. 뱅크·pose·게이트·seg_list·meta 는 d137 과 **바이트 동일**(직접 cmp 확인:
# seg_list_dynpose_{,dd10_}{train,test}.txt · meta_dynpose.csv 5개 전부 IDENTICAL).
# 캡션 24,371 행 중 3,225(13.2%)에서 지키지 못하는 프레이밍 절이 빠졌다. 예:
#   d137 : "... sliding to the left, keeping it in a medium wide shot until it leaves the frame."
#   c147 : "... sliding to the left."
#
# ═══ D137(dynpose_d137_da3) 와의 diff ════════════════════════════════════════════════════
# `exp_name` / `dl3dv_root` / `train_seg_list` / `test_seg_list` 네 줄. 나머지는 글자 그대로
# 같다 — 즉 이 arm 은 D137 의 **캡션 교체 대조군**이기도 하다 (같은 dd10 리스트, 같은 holdout
# 27편, 같은 seed/VAE/text_len).
#
# ═══ dd10 = DataDoP 를 **뺀** 게 아니라 10% 로 줄인 것 ═════════════════════════════════════
# 실측 (preset 접두사 `dd_` 로 판정 — `variant_id` 는 항상 `dyn_<n>__<preset>__hole<x>` 라
# 접두사 매칭이 0 을 낸다):
#     seg_list_dynpose_train        21927 행 / 240 씬   dd_ 13172 (60.1%)  track_ 4525  plain 4230
#     seg_list_dynpose_dd10_train    9728 행 / 240 씬   dd_   973 (10.0%)  track_ 4525  plain 4230
#     seg_list_dynpose_nodd_train    8755 행 / 240 씬   dd_     0 ( 0.0%)  track_ 4525  plain 4230
#     seg_list_dynpose_dd10_test     1129 행 /  27 씬   dd_   113 (10.0%)
#     seg_list_dynpose_nodd_test     1016 행 /  27 씬   dd_     0 ( 0.0%)
# nodd 는 dd10 에서 dd_ 973/113 행만 뺀 것이고 나머지 8755/1016 행은 **같은 행**이다 —
# D84 축(nodd 가 full 에서 60% 를 들어냈던 것)과 달리 여기서는 짝이 거의 like-for-like 다.
# 다만 테스트 리스트도 갈리므로(1129 vs 1016) 지표를 나란히 놓을 때 그 113 행 차이는 남는다.
#
# ═══ 재현 ════════════════════════════════════════════════════════════════════════════════
#     bash camera_generation/dataset/exec/_legacy/run_dynpose_d147_caption_export.sh   # 코퍼스
#     python latentcam/scripts/data/filter_seg_list_by_preset.py \
#       --root /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d137c147 \
#       --prefix seg_list_dynpose --exclude_presets_prefix dd_ --suffix nodd      # nodd 리스트
# dd10 리스트는 d137 에서 그대로 딸려왔다 (캡션만 바꾼 export 라 리스트가 재생성되지 않는다).
#
# ═══ geo raw 캐시는 d129 것을 그대로 쓴다 ════════════════════════════════════════════════
# 캐시 키가 scene 이름(`dynpose_<uuid>.pt`)이고 내용은 **소스 영상**의 geo feature 라 캡션·
# target 카메라와 무관하다. d129/d137/d137c147 은 씬 267편이 같으므로 11.34 GB 를 세 벌 두지
# 않는다.
exp_name: dynpose_d137c147_da3_dd10
dl3dv_root: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d137c147
meta_csv: meta_dynpose.csv
train_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d137c147/seg_list_dynpose_dd10_train.txt
test_seg_list: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d137c147/seg_list_dynpose_dd10_test.txt
coverage_blacklist_path: null

text_len: 128   # D123 이후 전 arm 공통. 캡션이 D121 자연어 판본이라 잘림 없음.

pose_source: da3
target_pose_source: da3_target_poses   # target 만 <scene>/da3/target_poses.npz 로 교체
scale_mode: avg_scale
avg_scale_ref: context_first_cam       # 디렉토리 avg_scale_context_first_cam <- scene_graph S
intr_norm: rel                         # vae_20260302_300 = frame-0-relative-intrinsics ckpt
cam_dim: 64                            # = 그 ckpt 의 latent_dim

geo_encoder: da3
geo_cam_embed: null
geo_latent_cache_dir: null
geo_posed: true
geo_shuffle_order: false
da3_geo_model: da3nested-giant-large
da3_geo_input_hw: [252, 448]
da3_geo_layers: last

geo_view_sampling: context_uniform  # context range = 영상 전체 [0,49) = 소스 영상 전체
geo_num_views: 6                    # _even_indices(49,6) = [0,10,19,29,38,48]
geo_first_view_target_s: true       # view0 = 프레임 s(=0). 이미 첫 픽이라 집합이 안 바뀐다.

# ↓ root 가 d137c147 인데 경로가 d129 인 것은 위 "geo raw 캐시" 절 참조 (씬 단위라 공유 가능).
geo_raw_cache_dir: /data1/cympyc1785/data/DynPose-LBM/latentcam_dynpose_d129/geo_raw_cache_da3
da3_cam_token_per_sample: true   # 캐시는 B=1 로 구워진다 — 켜야 on-the-fly 폴백과 일치

anchor_pred_frame0: true

video_latent_dim: 0   # video CA 블록 자체를 만들지 않는다 (D117 이전과 비트 동일)

batch_size: 8
epochs: 100          # 실제 집행자는 conf/config.yaml 의 `epoch_cap: 100`.
ckpt_at_epochs: [50, 100]
