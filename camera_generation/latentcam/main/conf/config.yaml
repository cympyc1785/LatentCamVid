scale_mode: avg_scale
# [new] intrinsics encoding of cam_param[..., 9:11] — a property of the VAE CKPT, independent of
# scale_mode. 'raw' = fx/2cx, fy/2cy (0.448, 0.796) | 'rel' = /frame0 (exactly 1.0 for DL3DV)
# | 'auto' = legacy coupling ('rel' iff scale_mode == avg_scale). Mismatch vs the ckpt silently
# destroys the intr channels (recon L1 0.26-0.36 instead of 0.002-0.013) — see dataset_dl3dv
# docstring and scripts/vae/vae_scale_matrix.py. vae_20260302_300 -> 'rel',
# vae_20260202_065659_400 -> 'raw'.
intr_norm: rel
lazy_dataset: true          # [new] __init__ builds only the sample index (cached); scene poses parsed lazily in __getitem__
use_vae: true
num_cam: 13
cam_dim: 64                 # MUST match the ckpt's latent_dim (20260302 -> 64, 20260202 -> 32)
vae_beta: 0.001
# SCVideo's config_large.py setting: vae_latent_scale 0.96032625 + 20260302/300.pth,
# scale_mode avg_scale, intr_norm rel, cam_dim 64 -- all matched above, constant used verbatim.
# That is genuinely config_large's pipeline: data/dataset_large.py:295-304 divides translations by
# the STORED point-cloud avg_scale (= our scale_mode 'avg_scale'; 'saved_avg_scale' is an alias)
# and line 313 divides the intrinsics by frame 0 (= our intr_norm 'rel').
# !! NOTE vae_latent_scale is supposed to be the MEASURED latent std of the
# (ckpt, scale_mode, intr_norm) triple, because train/infer do `encode(traj) / vae_latent_scale`.
# 0.96032625 was fit over SCVideo's MIXED corpus (DL3DV + DynamicVerse + dynpose-100k); on
# DL3DV-only this triple measures 0.47637, so the diffusion input std is **0.4960**, not 1.0000
# (i.e. the latents reach the model ~2.02x too SMALL). Kept verbatim by explicit user decision;
# use 0.47637 for exactly unit-std input on DL3DV-only.
# !! [2026-08-01] The per-cell numbers below are the script's MAX_SCENES=200 default (1264
# samples). That subset is LOW-MOTION and reads 4-7% low on every scale_mode -- systematic, not
# sampling noise. The FULL corpus (39817 segments / 6095 scenes) for vae_20260302_300 @ intr rel:
#   avg_scale 0.47637 (was 0.44696) | ctx_longer_135max 0.58341 (0.55882) | geo_lagernvs 0.53716
#   (0.51180); recon L1 trans 0.00336 / 0.00495 / 0.00430.
# Any config that pins vae_latent_scale must use a FULL-corpus measurement.
# [2026-08-02] DynamicVerse 도 같이 재봤다 (DATASET=dynamicverse|both, 606 scene / 1818 chunk,
# avg_scale 커버리지 1818/1818). vae_20260302_300 @ rel, FULL corpus:
#   scale_mode          DL3DV     DV       DL3DV+DV(41635)
#   avg_scale           0.47637   0.10070  0.46632
#   ctx_longer_135max   0.58341   0.42224  0.57732
#   geo_lagernvs        0.53716   0.32543  0.52968
# DV 의 avg_scale 행이 0.10 으로 극단적으로 작다: point-cloud avg_scale(장면 depth)이 카메라 이동보다
# 훨씬 커서 translation 이 거의 0 으로 눌린다 (recon L1 trans 0.00131 로 전 cell 중 최소지만
# 그건 표적이 작아서지 잘 맞춰서가 아니다). context 기반 분모(ctx_longer_135max/geo_lagernvs)에서도
# DV 가 DL3DV 보다 작다(0.42/0.33). 즉 DV 를 섞어도 0.96032625 는 재현되지 않는다 --
# 그 상수는 dynpose-100k 를 포함한 SCVideo 원본 corpus 값이고 우리 데이터로는 설명 안 된다.
# 지금 3-arm 은 DL3DV-only 학습이므로 config 에 박는 값은 DL3DV 열을 쓴다.
# Measured on 1264 DL3DV samples by scripts/vae/vae_scale_matrix.py (lat.std | recon L1
# rot/trans/intr):
#   20260302_300 (64) avg_scale rel -> 0.44696 | 0.00504 0.00301 0.00222   <-- active triple
#                                     (best recon of any cell measured)
#   20260302_300 (64) cam_dist_mean rel -> 0.99270                          (≈0.96 by coincidence;
#                                     NOT config_large's normalization -- do not use to justify it)
#   20260202_400 (32) avg_scale raw -> 0.46312 | 0.00466 0.00495 0.00293   (the DL3DV-only
#                                     config.py pair; needs cam_dim 32 + intr_norm raw)
#   20260202_400 (32) avg_scale rel -> 0.63741 | 0.00648 0.01081 0.26291   (wrong intr convention)
#   vae_dl3dv_1_7k (32) avg_scale raw -> 0.60943 | 0.00562 0.00953 0.00433 (our 1K-7K re-fit,
#                                     my_checkpoints/vae_dl3dv_1_7k/last.pth, scale 0.635126)
# See the dataset_dl3dv docstring: the intr convention is fixed by the CKPT, the scale_mode only
# rescales the translations. The full 16-cell matrix is in the CHANGELOG.
vae_latent_scale: 0.96032625
vae_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/checkpoints/vae_20260302_300.pth
num_gpus: 1
num_thread: 8
num_frames: 49
text_encoder: T5
text_len: 512
t5_dtype: bfloat16
t5_checkpoint_dir: /data1/cympyc1785/LatentCamVid/video_generation/models/DiffSynth-Studio/Wan-AI/Wan2.2-TI2V-5B
t5_checkpoint_path: models_t5_umt5-xxl-enc-bf16.pth
t5_tokenizer_path: google/umt5-xxl
point_encoder: concerto
# ===== DL3DV data + geo (scene-image) conditioning (latentcam additions beyond the
# original SCVideo text->camera config; [new] = added after config.py) =====
dl3dv_root: /data1/cympyc1785/data/DL3DV/scenes   # DL3DV scene root (images_8 = 480x270; see dataset_dl3dv.py)
meta_csv: meta.csv            # [new] scene-list CSV under dl3dv_root (e.g. meta_worldtraj.csv = 1K-7K − blacklist)
max_scenes: null              # cap #scenes loaded (null = all; small int for smoke tests)
train_seg_list: null          # [new] explicit train segment-list file (<batch>/<hash>/<seg>); null = random 90/10 split
test_seg_list: null           # [new] explicit val/test segment-list file; val = its first (val_max_batches×batch_size) segments
geo_encoder: lagernvs         # scene-context encoder: lagernvs (frozen VGGT recon -> 768-d tokens) | null (text-only)
train_frac: 0.9            # [new] random-split train share when train_seg_list/test_seg_list are null.
                          #   1.0 = use the WHOLE index for train and leave val empty; only for jobs that
                          #   never validate (the VAE fits, train_vae_dl3dv.py include_val=False).

geo_latent_dim: 768           # geo token dim (lagernvs = 768)
geo_num_views: 4              # #context views for 'even' sampling
geo_image_hw:                 # context image resolution fed to the geo encoder [H, W]
- 256
- 448
geo_view_sampling: even       # context-view selection: even (in-seg uniform) | frustum_cover (greedy coverage)
                              #   | hybrid (in-seg + covisibility) | random_inseg
geo_cover_k: 6                # frustum_cover: total #context views (incl. the fixed anchor)
geo_cover_radius: 2.5         # frustum_cover: coverage ball radius (× segment scale)
geo_cover_ndepth: 3           # frustum_cover: #depth samples along each ray for coverage scoring
geo_num_inseg: 3              # hybrid: #in-segment context views
geo_num_covis: 3              # hybrid: #covisibility-retrieved context views
geo_cover_out_of_seg: false   # frustum_cover: restrict candidates to OUT-of-target-segment frames (leakage-free)
geo_cover_before_only: false  # [new] out-of-seg context only from frames BEFORE the target segment (idx < s);
                              #   target must have earlier frames -> target = 2nd segment onward
geo_posed: false              # feed posed cam_token (context camera poses) to lagernvs; false = unposed
geo_lagernvs_skip_ctx_norm: false  # [new] skip lagernvs' own 1.35·max(context) norm; reuse target's initial
                              #   1.35·max_dist scale so target & geo latent share one frame+scale (full alignment)
geo_lagernvs_anchor: s        # [new 2026-08-03] scale_mode 'geo_lagernvs' 의 divisor 를 어느 카메라에서 재는가.
                              #   's'     (기본, 기존 동작) D = 1.35·max||c_geo - c_s||       — frame s 앵커
                              #   'view0'                   D = 1.35·max||c_geo - c_geo[0]|| — geo view0 앵커
                              # 왜 필요한가: geo_encoder.build_cam_token 은 항상 geo_idxs[0] 을 원점으로
                              #   재정렬한 뒤(models/geo_encoder.py:109-110) 1.35·max 로 나눈다. 그래서
                              #   override_scale=D 로 넣었을 때 LagerNVS 가 실제로 받는 스칼라
                              #   tok = max||c_geo - c_geo[0]|| / D 가 고유값 1/1.35 = 0.7407 이 되려면
                              #   D 도 geo_idxs[0] 앵커여야 한다. geo_first_view_target_s: true 면
                              #   geo_idxs[0] == s 라 두 앵커가 같은 점이고 값이 bit-identical -- 기존
                              #   arm B(geo_worldtraj_lagernvsnorm)가 tok 0.7407 을 그냥 얻던 이유가 이것.
                              #   false(camembed/decoupled)면 두 점이 달라져 실측 r = 1.35·max||·-c_geo[0]||/D
                              #   가 (0, 2] 로 흩어진다 (min 0.0420 / med 1.0997 / max 1.9985; 상한 2 는
                              #   c_geo[0] ∈ 집합 이라 삼각부등식에서 나오는 hard bound). 'view0' 이면 r ≡ 1.
                              # leak 없음: geo view 선택은 frame s 와 out-of-segment 프레임만 보므로 추론
                              #   시에도 동일하게 계산된다. target 궤적의 원점은 여전히 extrinsics[0] = c_s
                              #   이고 분모 스칼라만 바뀐다.
                              # !! geo_shuffle_order 와 병용 금지 (dataset 이 ValueError). 분모는 셔플 전
                              #   순서로 계산되는데 encoder 는 셔플 후 view0 을 보게 되어 앵커가 또 어긋난다.
geo_shuffle_order: false      # shuffle the geo context view order
geo_shuffle_keep_first: false # [new] when shuffling, keep view0 (anchor / frame s) fixed, shuffle only the rest
geo_first_view_target_s: false # geo view0 = target segment's FIRST camera (frame s) -> aligns geo latent frame
                              #   with the generation frame; remaining views are retrieved
geo_cover_centered_at_s: false # [renamed 2026-07-31 from geo_anchor_first_frame] honest frustum_cover: CENTER the
                              #   coverage ball on frame s (radius from context movement, never the unseen [s+1:e]).
                              #   This only steers WHERE the greedy search looks -- it never adds frame s (or any
                              #   target frame) to the encoder's context views; that is geo_first_view_target_s.
                              #   Verified: with geo_first_view_target_s false, view0 == frame s in 0/500 segments.
geo_cover_subtract_first: false # [new] subtract the fixed first-cam (s) coverage before the greedy pick, so the
                              #   remaining k-1 views maximize RESIDUAL coverage (what s doesn't already cover)
coverage_blacklist_path: null # per-segment coverage-blacklist CSV (columns scene,segment); null = no filtering
# [new] TEST-TIME probe: force K of the V context views to be TARGET-SEGMENT cameras (the frames
#   the model is asked to generate). null/0 = OFF, i.e. the sampler's pick is used unchanged.
#   The K views are evenly spaced over the target frames, so K=1 -> [s] exactly reproduces
#   geo_worldtraj's training condition (geo_first_view_target_s: true puts frame s in context and
#   geo_cover_out_of_seg: true keeps every other target frame out), K=3 -> [s, mid, last],
#   K=5 -> [s, 1/4, 2/4, 3/4, last]. They REPLACE the first K coverage views, so V is unchanged
#   and view0 is still s. Deliberate leakage: it asks whether the extra target views help and
#   whether the prediction collapses toward them. Setting it force-disables the geo latent cache
#   (the cache is keyed by segment, not by context view).
geo_test_inseg_k: null
# [new] per-context-view camera embedding channel-concatenated onto the geo tokens.
#   null (default) = OFF, i.e. the geo condition is exactly the (M, 768) LagerNVS tokens as before.
#   'relfirst'     = for each context view v build an 11-d pose relative to the TARGET segment's
#                    FIRST camera s -- rel = w2c_v @ inv(w2c_s), translation / norm_scale (the same
#                    divisor scale_mode gave the target), parametrized exactly like cam_param
#                    (rot6d = rel[:3,0] ++ rel[:3,1], trans = rel[:3,3], intr = fx/2cx, fy/2cy).
#                    The dataset appends those 11 raw dims to every patch token of that view, so
#                    geo_emb arrives as (M, 768+11); the MODEL splits them off, runs them through a
#                    trainable MLP (11 -> geo_cam_embed_dim) and concatenates, giving geo_proj an
#                    input of geo_latent_dim + geo_cam_embed_dim. Only the raw 11 dims are cached.
#   'plucker'      = same frame and units, but a 6-d Plücker ray PER PATCH TOKEN instead of one
#                    11-d pose per view: for patch (i,j) of view v, d = normalize(R^T K^-1 [x,y,1])
#                    and moment = o x d with o = -R^T t the camera center (both in frame s, t
#                    divided by the same norm_scale). geo_emb arrives as (M, 768+6) and the same
#                    trainable MLP (6 -> geo_cam_embed_dim) lifts it, so geo_proj input is
#                    unchanged at geo_latent_dim + geo_cam_embed_dim. Differences vs 'relfirst':
#                    the embedding VARIES WITHIN a view (each token gets its own ray, so a token
#                    knows which direction it looks at, not just which camera it came from) and
#                    there are no explicit intrinsics channels -- FoV is already in d. The patch
#                    grid is derived from geo_image_hw by the encoder's own resize rule
#                    (dataset_dl3dv._geo_patch_grid; (256,448) -> 21x37 = 777 per view) and
#                    attach_geo_cam asserts it against the real token count.
#   Intended for the ablation where the target's own first camera is NOT a context view
#   (geo_first_view_target_s: false): LagerNVS then anchors to an arbitrary context view, and this
#   embedding is what tells the model where each view sits in the generation frame.
#   Context intrinsics are kept RAW (fx/2cx, fy/2cy) regardless of intr_norm: under intr_norm 'rel'
#   the target's own intr channels are ~[1,1] by construction, so raw is the only way the context
#   FoV reaches the model. ('plucker' sidesteps this -- K enters through the ray directions.)
geo_cam_embed: null
geo_cam_embed_dim: 128        # width of the trainable MLP that lifts the raw dims (11 relfirst / 6 plucker)
# [new] precomputed frozen geo-latent cache (built by main/cache_geo_embeddings.py). null = OFF,
# i.e. the original behaviour: load context images and run LagerNVS every step. When set, the
# dataset loads <dir>/<first_cam_included|first_cam_not_included>/<iK>/<data_name>.pt instead and
# skips image I/O entirely; any segment missing from the cache silently falls back to the
# on-the-fly path, so a partial cache is safe. Valid ONLY because GeoEncoder.proj is nn.Identity
# for lagernvs (native 768 == geo_latent_dim 768) — with geo_latent_dim != 768 proj is a TRAINABLE
# Linear and its output must not be cached; dataset_dl3dv refuses the cache in that case.
# The cache is keyed by the geo context selection, so it is only valid for the experiment that
# built it (geo_worldtraj: frustum_cover + out_of_seg + subtract_first + anchor_first + posed).
geo_latent_cache_dir: null
geo_inseg_span: null          # in-seg sampling span override (null = full segment)
geo_covis_radius: 2.0         # covisibility retrieval: ball radius
geo_covis_theta0: 10.0        # covisibility retrieval: min view-angle separation (deg)
geo_covis_max_axis_deg: 80.0  # covisibility retrieval: max camera-axis angle vs anchor (deg)
geo_covis_topM: 32            # covisibility retrieval: candidate pool size (top-M nearest)
lagernvs_repo_path: /data1/cympyc1785/LatentCamVid/camera_generation/tools/lagernvs    # lagernvs code (for geo encoder)
lagernvs_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/tools/lagernvs/checkpoints/lagernvs_general_512/model.pt  # lagernvs weights
scenetok_repo_path: null      # alternative scenetok encoder repo (null = unused)
scenetok_ckpt_path: null      # scenetok checkpoint (null = unused)
clip_version: ViT-B/32
clip_max_length: 77
# config_large.py's CLaTr ckpt. It is an architecture-identical drop-in to the
# clatr_epoch109_dl3dv_seg_2.ckpt all our earlier runs used (same 260-key state_dict, no shape
# mismatch, both 191,546,118 B; CLaTr's input standardization comes from
# evaluate/CLaTr/configs/dataset/standardization/0120.yaml, not from the ckpt) but it is trained on
# a DIFFERENT corpus — so FD / PRDC / clatr_score from runs using this ckpt are NOT comparable with
# any number in EXPERIMENTS.log before 2026-07-30. Only compare epoch139-vs-epoch139.
clatr_ckpt_path: /data1/cympyc1785/LatentCamVid/camera_generation/latentcam/checkpoints/clatr_epoch139_large.ckpt
