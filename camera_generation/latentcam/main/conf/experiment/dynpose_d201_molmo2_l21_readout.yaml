# @package _global_
# D201-B — `dynpose_d200_molmo2_l21_da3.yaml` 과 **모델 배선 한 군데만** 다른 사본
# (사용자 지시 2026-09-19: "molmo2_l21_da3 를 원래 caption 쓰되 molmo2 에 readout module +
# probing module 추가했던 구조로").
#
# 캡션은 d200 기본 `prompts.json` 그대로다 — D201-A(`_mag`) 와 짝이 아니라 **대조축이 다르다**:
#   D201-A  캡션축 (framing + 정도부사)        모델은 d200 l21 그대로
#   D201-B  모델축 (readout + probe head)      캡션은 d200 그대로
# 둘을 한 파일에 섞지 않는다. 섞으면 둘 중 무엇이 움직였는지 못 가른다.
#
# ═══ 무엇이 바뀌나 (D195-A `dynpose_d194_molmo2_l21_readout` 와 같은 배선) ═══════════════
# d200 까지: molmo2 캐시 토큰(video 3136 + text 128 = 3264)이 LayerNorm + Linear 하나만 거쳐
#            **곧장** video CA 의 key/value 가 됐다. frozen encoder 의 좌표계를 DiT 가 층마다
#            직접 읽는 구조라, "어느 물체가 subject 이고 그게 어디로 가는가"를 중간에서
#            정리해 주는 자리가 없었다.
# 여기서는: 49개 learnable query 가 [self-attn → cross-attn(캐시 토큰) → MLP] 를 2번 돌아
#            요약을 만들고, **그 49 토큰이 video CA 의 key/value 를 대신한다**
#            (`models/camera_diffusion_model_latent.py §PeavReadout`). = readout module
#            거기에 MLP head 를 달아 **프레임별 subject OBB center** 를 맞히게 한다. = probing
#            module (aux head). query i 가 프레임 i 에 대응하도록 queries=49=프레임수 로 둔
#            이유가 이것이다.
# head 출력은 DiT 로 되돌아가지 않는다 — forward 가 (요약, aux예측) 을 따로 돌려주고 요약만
# CA 로 흘러가므로, **추론에서 aux 를 안 읽으면 그게 곧 "probe 를 뗀" 상태**다.
#
# ═══ aux_w 0.1 근거 (D194 코퍼스 453 씬 실측, D195-A 머리말에서 옮김) ════════════════════
#     x std 0.177 / y std 0.115 / z mean +0.603 std 0.287
#     per-coord MSE  pred=0 -> 0.164,  pred=전역평균 -> 0.042
# 학습 초기 aux ≈ 0.16 대 DiT 손실 ≈ 0.25, 후기 aux ≈ 0.01 대 DiT ≈ 0.014 로 두 손실이 같은
# 자릿수다. w=1 이면 보조가 주손실과 맞먹어 카메라 학습을 밀어낸다. w=0.1 이면 전 구간에서
# 총손실의 6~7% — 요약을 subject 쪽으로 밀되 주손실을 덮지 않는 크기다.
# ⚠ 이 수치는 d194 코퍼스 실측이다. d200 에서 다시 재지는 않았다 (같은 dynpose 게이지·같은
#   cam_param 정규화라 분포가 크게 다를 이유가 없지만, aux/DiT 비율은 wandb 에서 확인할 것).
#
# ═══ 데이터 전제 — `<scene>/da3/target_track.npz` ════════════════════════════════════════
# d200 코퍼스에는 없었다(0/10,169). 2026-09-19 에 전량 생성했다:
#   camera_generation/dataset/fit/bank/export_target_track.py --corpus dynpose \
#       --dl3dv_root <corpus> --out_root <CinemaTraj>/out_dynpose
#   -> scenes 10169  skipped 0  variants 51422  valid 51422 (100.0%)
# 파일이 없으면 dataset 이 **터진다** — 조용히 zero 조건으로 학습되면 이 arm 이 l21 대조군과
# 같아져 버리고 로그에 흔적이 안 남기 때문이다.
#
# ═══ 다시 안 굽는 것 ════════════════════════════════════════════════════════════════════
# 캡션·pose·seg list 가 한 글자도 안 바뀌므로 `prompts.json` / `umt5_cache/text_len128.pt` /
# `molmo2_cache/*` / `geo_raw_cache_da3_bf16` / `.latentcam_index` 전부 d200 것을 그대로 쓴다.
# 움직이는 건 모델 배선 네 줄뿐이다.
defaults:
  - dynpose_d200_molmo2_l21_da3

exp_name: dynpose_d201_molmo2_l21_readout

peav_readout_layers: 2      # "shallow". 0 이면 모듈 미생성 = l21 arm 과 비트 동일.
peav_readout_queries: 49    # = 프레임 수. 부수 효과로 video CA key/value 가 3264 -> 49.
peav_readout_aux_dim: 3     # subject OBB center xyz. 0 이면 head 미생성 + 손실 None.
peav_readout_aux_w: 0.1     # ↑ 근거 참조. aux_dim>0 인데 0 이면 학습 진입점에서 assert.

# x_t 채널 concat 은 **끄는** 게 이 arm 의 요점이다 — subject 위치를 조건으로 주는 게 아니라
# readout 이 스스로 알아내게 하는 것. dataset 은 aux_dim>0 만 봐도 target_track 키를 만든다.
target_track_dim: 0
