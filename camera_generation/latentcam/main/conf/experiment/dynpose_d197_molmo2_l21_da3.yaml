# @package _global_
# D197 — `dynpose_d197_molmo2_da3.yaml` 과 **한 줄만 다른** 사본: molmo2 hidden state 를
# 마지막 층이 아니라 `blocks[21]` 의 raw 출력에서 가져온다.
#
# 캐시는 다시 굽지 않는다 — `cache_molmo2_embeddings.py --extra_layer 21` 이 두 층을 같은
# 파일에 넣어 두고, `peav_layer` 가 읽는 키(`emb` vs `emb_l21`)만 바꾼다.
#
# ⚠ 두 층은 스케일이 크게 다르다 (D194 실측: |x| p50 마지막 1.076 vs layer21 0.519).
#   `peav_in_ln: true` 가 켜져 있어야 proj 이 그 차이를 흡수한다 — 부모 파일에 그대로 켜져 있다.
defaults:
  - dynpose_d197_molmo2_da3

exp_name: dynpose_d197_molmo2_l21_da3
peav_layer: 21             # ← 부모와의 유일한 차이. null 이면 마지막 층(ln_f 이후).
